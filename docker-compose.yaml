version: '3.3'

services:
  mental1104_dev:
    image: mental1104_dev:latest
    container_name: mental1104_dev
    security_opt:
      - seccomp=unconfined
    ports:
      - "127.0.0.1:31104:22"
      - "8080:8080"
    command: ["/usr/sbin/sshd", "-D"]
    volumes:
      - /home/espeon/:/data
      - ~/.ssh:/root/.ssh:rw  # 将宿主机的 .ssh 目录挂载到容器中
      - ~/.kube:/root/.kube # k8s配置映射到容器中
      - ./.env:/root/.env:rw
      - /var/run/docker.sock:/var/run/docker.sock
    # env_file:
    #   - .env
    # Some environment variable can be set in the .env file in the current directory, such as: 
    #  - GIT_AUTHOR_NAME=  # 设置 Git 提交的用户名
    #  - GIT_AUTHOR_EMAIL=  # 设置 Git 提交的邮箱
    #  - GIT_COMMITTER_NAME=  # 设置 Git 提交的用户名
    #  - GIT_COMMITTER_EMAIL=  # 设置 Git 提交的邮箱
    restart: always
    networks:
      - offline

networks:
  offline:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
