name: common-dev

services:
  common-dev:
    container_name: common-dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    init: true
    working_dir: /workspace/workflow
    ports:
      - "${DEVCONTAINER_SSH_BIND:-0.0.0.0}:${DEVCONTAINER_SSH_PORT:-2222}:22"
    environment:
      TZ: Asia/Shanghai
      GOWORK: /opt/mental1104/go.work
      GOPROXY: https://goproxy.cn,direct
    volumes:
      # 整个 workflow 以读写方式挂载，VS Code 可在不同仓库间切换。
      - type: bind
        source: ${WORKFLOW_ROOT:-/volume2/workflow}
        target: /workspace/workflow
        bind:
          create_host_path: false
      # common 额外挂载到镜像已有工具链约定的路径，保持 Go / Rust 配置兼容。
      - type: bind
        source: ${WORKFLOW_ROOT:-/volume2/workflow}/common
        target: /opt/mental1104
        bind:
          create_host_path: false
      # SSH 公钥只读挂载到开发用户；客户端私钥不进入 NAS 或容器。
      - type: bind
        source: ${DEVCONTAINER_DATA_ROOT:-/volume2/workflow/.devcontainer-state}/ssh/authorized_keys
        target: /home/developer/.ssh/authorized_keys
        read_only: true
        bind:
          create_host_path: false
      # 持久化 SSH 主机密钥，重建容器后客户端不会遇到主机身份变化。
      - type: bind
        source: ${DEVCONTAINER_DATA_ROOT:-/volume2/workflow/.devcontainer-state}/ssh/hostkeys
        target: /var/lib/sshd-hostkeys
        bind:
          create_host_path: false
      # 工具缓存和 VS Code 扩展保存在 SSD 工作区，容器重建后仍可复用。
      - type: bind
        source: ${DEVCONTAINER_DATA_ROOT:-/volume2/workflow/.devcontainer-state}/vscode-server
        target: /home/developer/.vscode-server
      - type: bind
        source: ${DEVCONTAINER_DATA_ROOT:-/volume2/workflow/.devcontainer-state}/go-bin
        target: /home/developer/go/bin
      - type: bind
        source: ${DEVCONTAINER_DATA_ROOT:-/volume2/workflow/.devcontainer-state}/go-mod
        target: /home/developer/go/pkg/mod
      - type: bind
        source: ${DEVCONTAINER_DATA_ROOT:-/volume2/workflow/.devcontainer-state}/cargo-registry
        target: /home/developer/.cargo/registry
      - type: bind
        source: ${DEVCONTAINER_DATA_ROOT:-/volume2/workflow/.devcontainer-state}/cargo-git
        target: /home/developer/.cargo/git
      - type: bind
        source: ${DEVCONTAINER_DATA_ROOT:-/volume2/workflow/.devcontainer-state}/cache
        target: /home/developer/.cache
    restart: unless-stopped
