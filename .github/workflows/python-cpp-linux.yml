name: Linux

on:
  push:
  pull_request:

env:
  PYTHONPATH: ${{ github.workspace }}
  DATABASE_URL: postgresql://test:test@localhost:5432/app
  REDIS_URL: redis://localhost:6379/0
  PGUSER: test
  PGPASSWORD: test
  PGDATABASE: app
  PGHOST: localhost
  PGPORT: "5432"
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  PULSAR_HOST: localhost
  PULSAR_BROKER_PORT: "6650"
  PULSAR_ADMIN_PORT: "8080"
  PULSAR_TOKEN: "dummy"
  PULSAR_SCHEMA_PATH: "/tmp/pulsar/schema"
  PULSAR_DATA_PATH: "/tmp/pulsar/data"
  # CLICKHOUSE_USER: default
  # CLICKHOUSE_HOST: localhost
  # CLICKHOUSE_PORT: "8123"
  # CLICKHOUSE_DATABASE: default
  # MONGO_HOST: localhost
  # MONGO_PORT: "27017"
  # GOPROXY: "direct"

jobs:
  python-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=5
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        run: |
          python3 - <<'PY'
          import sys
          from devtool.commands.common import base_env
          from devtool.commands.ops import cpp as cpp_ops
          sys.exit(cpp_ops.git_submodules(base_env()) or 0)
          PY

      - name: Wait for postgres/redis
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5432) && (echo > /dev/tcp/127.0.0.1/6379) && exit 0
            sleep 1
          done
          echo "services not ready" >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Setup Python
        run: ./dev setup-python

      - name: Format Python
        run: ./dev fmt-python

      - name: Build Python
        run: ./dev build-python

      - name: Test Python
        run: ./dev test-python

      - name: Coverage Python
        run: ./dev coverage-python

      - name: Vet Python
        continue-on-error: true
        run: ./dev vet-python

      - name: Guard Python
        continue-on-error: true
        run: ./dev guard-python

  cpp-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=5
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: gcov
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        run: |
          python3 - <<'PY'
          import sys
          from devtool.commands.common import base_env
          from devtool.commands.ops import cpp as cpp_ops
          sys.exit(cpp_ops.git_submodules(base_env()) or 0)
          PY

      - name: Wait for postgres/redis
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5432) && (echo > /dev/tcp/127.0.0.1/6379) && exit 0
            sleep 1
          done
          echo "services not ready" >&2
          exit 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang-format clang-tidy gcovr lcov \
            libmpfr-dev libgmp-dev

      - name: Setup C++
        run: ./dev setup-cpp --config Debug

      - name: Format C++
        run: ./dev fmt-cpp

      - name: Build C++
        run: ./dev build-cpp --config Debug

      - name: Test C++
        run: ./dev test-cpp

      - name: Coverage C++
        run: ./dev coverage-cpp

      - name: Vet C++
        continue-on-error: true
        run: ./dev vet-cpp

      - name: Guard C++
        continue-on-error: true
        run: ./dev guard-cpp
