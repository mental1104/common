name: Rust

on:
  workflow_call:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true
  push:
    branches-ignore:
      - main
    paths:
      - "rust/**"
      - "devops/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "devops/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true

env:
  CARGO_TEST_V: ${{ (vars.CI_VERBOSE_LOGS == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verbose_logs == false || github.event.inputs.verbose_logs == 'false')) || (github.event_name == 'workflow_call' && (inputs.verbose_logs == false || inputs.verbose_logs == 'false'))) && '' || '-- --nocapture' }}

jobs:
  linux:
    name: Linux / Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "stable"
          - toolchain: "1.85.0"
            msrv: true
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/devops
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import sys
          from devtool.commands.common import base_env
          from devtool.commands.ops import cpp as cpp_ops
          sys.exit(cpp_ops.git_submodules(base_env()) or 0)
          PY
      - name: Install Rust toolchain
        continue-on-error: true
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
      - name: Add rustfmt/clippy
        if: ${{ matrix.toolchain == 'stable' }}
        continue-on-error: true
        run: rustup component add rustfmt clippy
      - name: Setup Rust
        continue-on-error: true
        run: ./dev setup-rust
      - name: Format Rust
        if: ${{ matrix.toolchain == 'stable' }}
        continue-on-error: true
        run: ./dev fmt-rust
      - name: Build Rust
        continue-on-error: true
        run: ./dev build-rust
      - name: Coverage Rust
        continue-on-error: true
        run: ./dev coverage-rust
      - name: Vet Rust
        if: ${{ matrix.toolchain == 'stable' }}
        continue-on-error: true
        run: ./dev vet-rust
      - name: Guard Rust
        if: ${{ matrix.toolchain == 'stable' }}
        continue-on-error: true
        run: ./dev guard-rust
      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          (cd rust/mental1104 && cargo llvm-cov --all-features --ignore-filename-regex='(^|/)(tests?|benches?|examples)/' --cobertura --output-path coverage.xml) || true

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage_rust.py \
            --os linux \
            --toolchain "${{ matrix.toolchain }}" \
            --xml rust/mental1104/coverage.xml \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'lang':'rust','os':'linux','toolchain':os.getenv('RUST_TOOLCHAIN','${{ matrix.toolchain }}'),'line_pct':0.0,'status':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'source':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi
      - name: Stash coverage files (unique path)
        id: stash
        if: always()
        continue-on-error: true
        run: |
          set +e
          toolchain_key="$(echo "${{ matrix.toolchain }}" | tr -d '.')"
          artifact_key="linux-${toolchain_key}"
          echo "artifact_key=${artifact_key}" >> "$GITHUB_OUTPUT"
          mkdir -p "_cov/rust/${artifact_key}"
          cp -f cov.json "_cov/rust/${artifact_key}/cov.json" 2>/dev/null || true
      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rust-cov-${{ steps.stash.outputs.artifact_key }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn

  macos:
    name: macOS / Rust stable
    runs-on: macos-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/devops
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import sys
          from devtool.commands.common import base_env
          from devtool.commands.ops import cpp as cpp_ops
          sys.exit(cpp_ops.git_submodules(base_env()) or 0)
          PY
      - name: Install Rust toolchain
        continue-on-error: true
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Setup Rust
        continue-on-error: true
        run: ./dev setup-rust
      - name: Build Rust
        continue-on-error: true
        run: ./dev build-rust
      - name: Coverage Rust
        continue-on-error: true
        run: ./dev coverage-rust
      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          (cd rust/mental1104 && cargo llvm-cov --all-features --ignore-filename-regex='(^|/)(tests?|benches?|examples)/' --cobertura --output-path coverage.xml) || true

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage_rust.py \
            --os macos \
            --toolchain "stable" \
            --xml rust/mental1104/coverage.xml \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'lang':'rust','os':'macos','toolchain':'stable','line_pct':0.0,'status':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'source':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi
      - name: Stash coverage files (unique path)
        id: stash
        if: always()
        continue-on-error: true
        run: |
          set +e
          artifact_key="macos-stable"
          echo "artifact_key=${artifact_key}" >> "$GITHUB_OUTPUT"
          mkdir -p "_cov/rust/${artifact_key}"
          cp -f cov.json "_cov/rust/${artifact_key}/cov.json" 2>/dev/null || true
      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rust-cov-${{ steps.stash.outputs.artifact_key }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn

  windows:
    name: Windows / Rust stable
    runs-on: windows-latest
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}/devops
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: python -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"
      - name: Install Rust toolchain
        continue-on-error: true
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Setup Rust
        continue-on-error: true
        run: python -m devtool.cli setup-rust
      - name: Build Rust
        continue-on-error: true
        run: python -m devtool.cli build-rust
      - name: Coverage Rust
        continue-on-error: true
        run: python -m devtool.cli coverage-rust
      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          Push-Location rust/mental1104
          cargo llvm-cov --all-features --ignore-filename-regex="(^|/)(tests?|benches?|examples)/" --cobertura --output-path coverage.xml
          Pop-Location

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          python tools/ci/extract_coverage_rust.py --os windows --toolchain "stable" --xml rust/mental1104/coverage.xml --out cov.json

          if (-not (Test-Path cov.json)) {
            python -c "import json,os; obj={'lang':'rust','os':'windows','toolchain':'stable','line_pct':0.0,'status':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'source':'placeholder'}; json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          }
      - name: Stash coverage files (unique path)
        id: stash
        if: always()
        continue-on-error: true
        run: |
          $artifactKey = "windows-stable"
          "artifact_key=$artifactKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path "_cov/rust/$artifactKey" | Out-Null
          Copy-Item -Force cov.json "_cov/rust/$artifactKey/cov.json" -ErrorAction SilentlyContinue
      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rust-cov-${{ steps.stash.outputs.artifact_key }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn
