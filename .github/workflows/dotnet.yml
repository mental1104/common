name: .NET

on:
  workflow_call:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true
  push:
    branches-ignore:
      - main
    paths:
      - "dotnet/**"
      - "devops/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "devops/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true

env:
  DOTNET_TEST_LOGGER: ${{ (vars.CI_VERBOSE_LOGS == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verbose_logs == false || github.event.inputs.verbose_logs == 'false')) || (github.event_name == 'workflow_call' && (inputs.verbose_logs == false || inputs.verbose_logs == 'false'))) && '' || 'console;verbosity=detailed' }}

jobs:
  linux:
    name: Linux / .NET ${{ matrix.dotnet }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x"]
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/devops
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Setup .NET
        continue-on-error: true
        run: ./dev setup-dotnet
      - name: Build .NET
        continue-on-error: true
        run: ./dev build-dotnet
      - name: Coverage .NET
        continue-on-error: true
        env:
          DOTNET_TEST_NO_BUILD: "1"
        run: ./dev coverage-dotnet
      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage_dotnet.py \
            --os linux \
            --dotnet "${{ matrix.dotnet }}" \
            --root dotnet \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'lang':'dotnet','os':'linux','dotnet':'${{ matrix.dotnet }}','line_pct':0.0,'status':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'source':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi
      - name: Stash coverage files (unique path)
        id: stash
        if: always()
        continue-on-error: true
        run: |
          set +e
          dotnet_key="$(echo "${{ matrix.dotnet }}" | tr -d '.')"
          artifact_key="linux-dotnet${dotnet_key}"
          echo "artifact_key=${artifact_key}" >> "$GITHUB_OUTPUT"
          mkdir -p "${GITHUB_WORKSPACE}/_cov/dotnet/${artifact_key}"
          cp -f cov.json "${GITHUB_WORKSPACE}/_cov/dotnet/${artifact_key}/cov.json" 2>/dev/null || true
      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-cov-${{ steps.stash.outputs.artifact_key }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn
      - name: verify-install-dotnet
        run: ./dev verify-install dotnet

  macos:
    name: macOS / .NET ${{ matrix.dotnet }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x"]
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/devops
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Setup .NET
        continue-on-error: true
        run: ./dev setup-dotnet
      - name: Build .NET
        continue-on-error: true
        run: ./dev build-dotnet
      - name: Coverage .NET
        continue-on-error: true
        env:
          DOTNET_TEST_NO_BUILD: "1"
        run: ./dev coverage-dotnet
      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage_dotnet.py \
            --os macos \
            --dotnet "${{ matrix.dotnet }}" \
            --root dotnet \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'lang':'dotnet','os':'macos','dotnet':'${{ matrix.dotnet }}','line_pct':0.0,'status':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'source':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi
      - name: Stash coverage files (unique path)
        id: stash
        if: always()
        continue-on-error: true
        run: |
          set +e
          dotnet_key="$(echo "${{ matrix.dotnet }}" | tr -d '.')"
          artifact_key="macos-dotnet${dotnet_key}"
          echo "artifact_key=${artifact_key}" >> "$GITHUB_OUTPUT"
          mkdir -p "${GITHUB_WORKSPACE}/_cov/dotnet/${artifact_key}"
          cp -f cov.json "${GITHUB_WORKSPACE}/_cov/dotnet/${artifact_key}/cov.json" 2>/dev/null || true
      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-cov-${{ steps.stash.outputs.artifact_key }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn
      - name: verify-install-dotnet
        run: ./dev verify-install dotnet

  windows:
    name: Windows / .NET ${{ matrix.dotnet }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x"]
    env:
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}/devops
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Setup .NET
        continue-on-error: true
        run: python -m devtool.cli setup-dotnet
      - name: Build .NET
        continue-on-error: true
        run: python -m devtool.cli build-dotnet
      - name: Coverage .NET
        continue-on-error: true
        env:
          DOTNET_TEST_NO_BUILD: "1"
        run: python -m devtool.cli coverage-dotnet
      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          python tools/ci/extract_coverage_dotnet.py --os windows --dotnet "${{ matrix.dotnet }}" --root dotnet --out cov.json

          if (-not (Test-Path cov.json)) {
            python -c "import json,os; obj={'lang':'dotnet','os':'windows','dotnet':'${{ matrix.dotnet }}','line_pct':0.0,'status':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'source':'placeholder'}; json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          }
      - name: Stash coverage files (unique path)
        id: stash
        if: always()
        continue-on-error: true
        run: |
          $dotnetKey = "${{ matrix.dotnet }}".Replace(".", "")
          $artifactKey = "windows-dotnet$dotnetKey"
          "artifact_key=$artifactKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/_cov/dotnet/$artifactKey" | Out-Null
          Copy-Item -Force cov.json "$env:GITHUB_WORKSPACE/_cov/dotnet/$artifactKey/cov.json" -ErrorAction SilentlyContinue
      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-cov-${{ steps.stash.outputs.artifact_key }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn
      - name: verify-install-dotnet
        run: python -m devtool.cli verify-install dotnet
