name: .NET

on:
  workflow_call:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true
  push:
    paths:
      - "dotnet/**"
      - "devops/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "devops/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true

env:
  DOTNET_TEST_LOGGER: ${{ (vars.CI_VERBOSE_LOGS == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verbose_logs == false || github.event.inputs.verbose_logs == 'false')) || (github.event_name == 'workflow_call' && (inputs.verbose_logs == false || inputs.verbose_logs == 'false'))) && '' || 'console;verbosity=detailed' }}

jobs:
  linux:
    name: Linux / .NET ${{ matrix.dotnet }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x"]
    defaults:
      run:
        shell: bash
        working-directory: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Restore
        continue-on-error: true
        run: dotnet restore mental1104.sln
      - name: Build
        continue-on-error: true
        run: dotnet build mental1104.sln --configuration Release --no-restore
      - name: Coverage
        continue-on-error: true
        run: |
          if [ -n "${DOTNET_TEST_LOGGER}" ]; then
            dotnet test mental1104.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "${DOTNET_TEST_LOGGER}"
          else
            dotnet test mental1104.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
          fi
      - name: Extract cov.json (placeholder)
        if: always()
        continue-on-error: true
        run: |
          set +e
          if [ -f cov.json ]; then
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          obj = {
            "lang": "dotnet",
            "os": "linux",
            "dotnet": os.getenv("DOTNET_VERSION", "unknown"),
            "line_pct": 0.0,
            "status": "placeholder",
            "sha": os.getenv("GITHUB_SHA", ""),
            "run_id": os.getenv("GITHUB_RUN_ID", ""),
            "source": "placeholder",
          }
          with open("cov.json", "w", encoding="utf-8") as f:
            json.dump(obj, f, ensure_ascii=False, indent=2)
          PY
        env:
          DOTNET_VERSION: ${{ matrix.dotnet }}
      - name: Stash coverage files (unique path)
        id: stash
        if: always()
        continue-on-error: true
        run: |
          set +e
          dotnet_key="$(echo "${{ matrix.dotnet }}" | tr -d '.')"
          artifact_key="linux-dotnet${dotnet_key}"
          echo "artifact_key=${artifact_key}" >> "$GITHUB_OUTPUT"
          mkdir -p "${GITHUB_WORKSPACE}/_cov/dotnet/${artifact_key}"
          cp -f cov.json "${GITHUB_WORKSPACE}/_cov/dotnet/${artifact_key}/cov.json" 2>/dev/null || true
      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-cov-${{ steps.stash.outputs.artifact_key }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn

  macos:
    name: macOS / .NET ${{ matrix.dotnet }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x"]
