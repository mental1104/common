name: .NET

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true

env:
  DOTNET_TEST_LOGGER: ${{ (vars.CI_VERBOSE_LOGS == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verbose_logs == false || github.event.inputs.verbose_logs == 'false'))) && '' || '--logger \"console;verbosity=detailed\"' }}

jobs:
  linux:
    name: Linux / .NET ${{ matrix.dotnet }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x"]
    defaults:
      run:
        shell: bash
        working-directory: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Restore
        run: dotnet restore mental1104.sln
      - name: Build
        run: dotnet build mental1104.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test mental1104.sln --configuration Release --no-build ${{ env.DOTNET_TEST_LOGGER }}

  macos:
    name: macOS / .NET ${{ matrix.dotnet }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x"]
    defaults:
      run:
        shell: bash
        working-directory: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Restore
        run: dotnet restore mental1104.sln
      - name: Build
        run: dotnet build mental1104.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test mental1104.sln --configuration Release --no-build ${{ env.DOTNET_TEST_LOGGER }}

  windows:
    name: Windows / .NET ${{ matrix.dotnet }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x"]
    defaults:
      run:
        shell: pwsh
        working-directory: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Restore
        run: dotnet restore mental1104.sln
      - name: Build
        run: dotnet build mental1104.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test mental1104.sln --configuration Release --no-build ${{ env.DOTNET_TEST_LOGGER }}
