name: Linux Experimental

on:
  push:
  pull_request:

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/devops
  DATABASE_URL: postgresql://test:test@localhost:5432/app
  REDIS_URL: redis://localhost:6379/0
  PGUSER: test
  PGPASSWORD: test
  PGDATABASE: app
  PGHOST: localhost
  PGPORT: &pg_port "5432"
  PGPORT_MAP: &pg_port_map "5432:5432"
  REDIS_HOST: localhost
  REDIS_PORT: &redis_port "6379"
  REDIS_PORT_MAP: &redis_port_map "6379:6379"
  PULSAR_HOST: localhost
  PULSAR_BROKER_PORT: &pulsar_broker_port "6650"
  PULSAR_BROKER_PORT_MAP: &pulsar_broker_port_map "6650:6650"
  PULSAR_ADMIN_PORT: &pulsar_admin_port "8080"
  PULSAR_ADMIN_PORT_MAP: &pulsar_admin_port_map "8080:8080"
  PULSAR_TOKEN: ""
  PULSAR_SCHEMA_PATH: "/tmp/pulsar/schema"
  PULSAR_DATA_PATH: "/tmp/pulsar/data"
  # CLICKHOUSE_USER: default
  # CLICKHOUSE_HOST: localhost
  # CLICKHOUSE_PORT: "8123"
  # CLICKHOUSE_DATABASE: default
  # MONGO_HOST: localhost
  # MONGO_PORT: "27017"
  # GOPROXY: "direct"

jobs:
  cpp-linux-clang:
    name: C++ (clang, c++20)
    runs-on: ubuntu-latest
    services: &common_services
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app
        ports:
          - *pg_port_map
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s --health-timeout=5s --health-retries=5
      redis:
        image: redis/redis-stack-server:7.2.0-v7
        ports:
          - *redis_port_map
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=5
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: gcov
      CC: clang
      CXX: clang++
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import sys
          from devtool.commands.common import base_env
          from devtool.commands.ops import cpp as cpp_ops
          sys.exit(cpp_ops.git_submodules(base_env()) or 0)
          PY

      - name: Start Pulsar (standalone -nss)
        continue-on-error: true
        run: |
          docker rm -f pulsar || true
          docker run -d --name pulsar \
            -p ${PULSAR_BROKER_PORT}:${PULSAR_BROKER_PORT} -p ${PULSAR_ADMIN_PORT}:${PULSAR_ADMIN_PORT} \
            apachepulsar/pulsar:3.2.0 \
            bin/pulsar standalone -nss

      - name: Wait for postgres/redis/pulsar
        continue-on-error: true
        run: |
          for i in {1..40}; do
            (echo > /dev/tcp/127.0.0.1/${PGPORT}) && (echo > /dev/tcp/127.0.0.1/${REDIS_PORT}) && (echo > /dev/tcp/127.0.0.1/${PULSAR_ADMIN_PORT}) && exit 0
            sleep 2
          done
          echo "services not ready" >&2
          exit 1

      - name: Install toolchain
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang clang-format clang-tidy gcovr lcov \
            libmpfr-dev libgmp-dev

      - name: Setup C++ (clang)
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Build C++ (clang)
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Test C++ (clang)
        continue-on-error: true
        run: ./dev test-cpp

      - name: Test redis-plus-plus (clang)
        continue-on-error: true
        run: ./dev test-redispp --config Debug

  cpp-linux-gcc-std:
    name: C++ (g++, std=${{ matrix.cxx_std }})
    runs-on: ubuntu-latest
    services: *common_services
    strategy:
      fail-fast: false
      matrix:
        cxx_std: ["11", "14", "17", "20", "23"]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: gcov
      CC: gcc
      CXX: g++
      CXX_STD: ${{ matrix.cxx_std }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import sys
          from devtool.commands.common import base_env
          from devtool.commands.ops import cpp as cpp_ops
          sys.exit(cpp_ops.git_submodules(base_env()) or 0)
          PY

      - name: Start Pulsar (standalone -nss)
        continue-on-error: true
        run: |
          docker rm -f pulsar || true
          docker run -d --name pulsar \
            -p ${PULSAR_BROKER_PORT}:${PULSAR_BROKER_PORT} -p ${PULSAR_ADMIN_PORT}:${PULSAR_ADMIN_PORT} \
            apachepulsar/pulsar:3.2.0 \
            bin/pulsar standalone -nss

      - name: Wait for postgres/redis/pulsar
        continue-on-error: true
        run: |
          for i in {1..40}; do
            (echo > /dev/tcp/127.0.0.1/${PGPORT}) && (echo > /dev/tcp/127.0.0.1/${REDIS_PORT}) && (echo > /dev/tcp/127.0.0.1/${PULSAR_ADMIN_PORT}) && exit 0
            sleep 2
          done
          echo "services not ready" >&2
          exit 1

      - name: Install toolchain
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build gcovr lcov \
            libmpfr-dev libgmp-dev

      - name: Set C++ standard
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          std = os.environ["CXX_STD"]
          path = Path("cpp/cmake/project_settings.cmake")
          data = path.read_text()
          needle = "set(CMAKE_CXX_STANDARD 20)"
          if needle not in data:
              raise SystemExit("CMAKE_CXX_STANDARD line not found")
          path.write_text(data.replace(needle, f"set(CMAKE_CXX_STANDARD {std})", 1))
          PY

      - name: Setup C++ (g++ c++${{ matrix.cxx_std }})
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Build C++ (g++ c++${{ matrix.cxx_std }})
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Test C++ (g++ c++${{ matrix.cxx_std }})
        continue-on-error: true
        run: ./dev test-cpp

      - name: Test redis-plus-plus (g++ c++${{ matrix.cxx_std }})
        continue-on-error: true
        run: ./dev test-redispp --config Debug
