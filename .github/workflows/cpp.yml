name: C++

on:
  push:
    paths:
      - "cpp/**"
      - "devops/**"
      - ".github/workflows/cpp.yml"
  pull_request:
    paths:
      - "cpp/**"
      - "devops/**"
      - ".github/workflows/cpp.yml"
  workflow_dispatch:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true

env:
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/devops"
  CTEST_V: "${{ (vars.CI_VERBOSE_LOGS == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verbose_logs == false || github.event.inputs.verbose_logs == 'false'))) && '' || '-V' }}"

jobs:
  linux:
    name: Linux / ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} / C++${{ matrix.cxx_std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        cxx_std: ["11", "14", "17", "20", "23"]
        exclude:
          - compiler: gcc
            cxx_std: "20"
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: ${{ matrix.compiler == 'clang' && 'llvm-cov gcov' || 'gcov' }}
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      CXX_STD: ${{ matrix.cxx_std }}
      # 用于文件名/URL，避免 "++"
      COMPILER_KEY: ${{ matrix.compiler == 'clang' && 'clangpp' || 'gpp' }}
      # 用于 cov.json 里展示
      COMPILER_LABEL: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Install toolchain
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang clang-format clang-tidy gcovr lcov \
            libmpfr-dev libgmp-dev

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Format C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev fmt-cpp

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage.py \
            --os linux \
            --compiler "${COMPILER_LABEL}" \
            --cxx-std ${{ matrix.cxx_std }} \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'linux','compiler':os.getenv('COMPILER_LABEL','unknown'),'cxx_std':int('${{ matrix.cxx_std }}'),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="linux-${COMPILER_KEY}-cxx${{ matrix.cxx_std }}"
          mkdir -p "_cov/${key}"
          cp -f cov.json "_cov/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-linux-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          path: _cov/linux-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          retention-days: 7
          if-no-files-found: warn

      - name: Vet C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev vet-cpp

      - name: Guard C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev guard-cpp

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  linux-integration:
    name: Linux / g++ / C++20 / coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s --health-timeout=5s --health-retries=55
      redis:
        image: redis/redis-stack-server:7.2.0-v7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=5
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: gcov
      CC: gcc
      CXX: g++
      CXX_STD: "20"
      DATABASE_URL: postgresql://test:test@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: app
      PGHOST: localhost
      PGPORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      PULSAR_HOST: localhost
      PULSAR_BROKER_PORT: "6650"
      PULSAR_ADMIN_PORT: "8080"
      PULSAR_TOKEN: ""
      PULSAR_SCHEMA_PATH: "/tmp/pulsar/schema"
      PULSAR_DATA_PATH: "/tmp/pulsar/data"
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Start Pulsar (standalone -nss)
        id: pulsar
        continue-on-error: true
        run: |
          docker rm -f pulsar || true
          docker run -d --name pulsar \
            -p ${PULSAR_BROKER_PORT}:${PULSAR_BROKER_PORT} -p ${PULSAR_ADMIN_PORT}:${PULSAR_ADMIN_PORT} \
            apachepulsar/pulsar:3.2.0 \
            bin/pulsar standalone -nss

      - name: Wait for postgres/redis/pulsar
        id: wait_services
        continue-on-error: true
        run: |
          for i in {1..40}; do
            (echo > /dev/tcp/127.0.0.1/${PGPORT}) && (echo > /dev/tcp/127.0.0.1/${REDIS_PORT}) && (echo > /dev/tcp/127.0.0.1/${PULSAR_ADMIN_PORT}) && exit 0
            sleep 2
          done
          echo "services not ready" >&2
          exit 1

      - name: Install toolchain
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang clang-format clang-tidy gcovr lcov \
            libmpfr-dev libgmp-dev

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Test redis-plus-plus
        id: test_redispp
        continue-on-error: true
        run: ./dev test-redispp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage.py \
            --os linux \
            --compiler g++ \
            --cxx-std 20 \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'linux','compiler':'g++','cxx_std':20,'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="linux-gpp-cxx20-integration"
          mkdir -p "_cov/${key}"
          cp -f cov.json "_cov/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-linux-gpp-cxx20-integration
          path: _cov/linux-gpp-cxx20-integration
          retention-days: 7
          if-no-files-found: warn

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' || steps.wait_services.outcome == 'failure' }}
        run: exit 1

  macos:
    name: macOS / ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} / C++${{ matrix.cxx_std }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        cxx_std: ["11", "14", "17", "20", "23"]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      CXX_STD: ${{ matrix.cxx_std }}
      GCOV: "llvm-cov gcov"
      COMPILER_KEY: ${{ matrix.compiler == 'clang' && 'clangpp' || 'gpp' }}
      COMPILER_LABEL: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Install toolchain
        continue-on-error: true
        run: |
          brew update
          brew install cmake llvm ninja gcovr lcov mpfr gmp gcc
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage.py \
            --os macos \
            --compiler "${COMPILER_LABEL}" \
            --cxx-std ${{ matrix.cxx_std }} \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'macos','compiler':os.getenv('COMPILER_LABEL','unknown'),'cxx_std':int('${{ matrix.cxx_std }}'),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="macos-${COMPILER_KEY}-cxx${{ matrix.cxx_std }}"
          mkdir -p "_cov/${key}"
          cp -f cov.json "_cov/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-macos-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          path: _cov/macos-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          retention-days: 7
          if-no-files-found: warn

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  windows:
    name: Windows / MSVC / C++${{ matrix.cxx_std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cxx_std: ["11", "14", "17", "20", "23"]
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}/devops
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CXX_STD: ${{ matrix.cxx_std }}
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        id: init_submodules
        continue-on-error: true
        run: python -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: python -m devtool.cli setup-cpp --config Debug

      - name: Build export C++ layer
        id: build_export
        continue-on-error: true
        run: python -m devtool.cli build-export-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: python -m devtool.cli build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: python -m devtool.cli coverage-cpp

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          python tools/ci/extract_coverage.py `
            --os windows `
            --compiler msvc `
            --cxx-std ${{ matrix.cxx_std }} `
            --out cov.json

          if (-not (Test-Path cov.json)) {
            python -c "import json,os; obj={'os':'windows','compiler':'msvc','cxx_std':int(os.getenv('CXX_STD','0') or 0),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'}; json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          }

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          $key = "windows-msvc-cxx${{ matrix.cxx_std }}"
          New-Item -ItemType Directory -Force -Path "_cov/$key" | Out-Null
          Copy-Item -Force cov.json "_cov/$key/cov.json" -ErrorAction SilentlyContinue

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-windows-msvc-cxx${{ matrix.cxx_std }}
          path: _cov/windows-msvc-cxx${{ matrix.cxx_std }}
          retention-days: 7
          if-no-files-found: warn

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  pages:
    name: Pages / C++ coverage dashboard
    if: ${{ false && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: [linux, linux-integration, macos, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: _cov
          pattern: cpp-cov-*
          merge-multiple: false

      - name: Build coverage site + badges (dist/)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, os, statistics, html
          from pathlib import Path

          def compiler_slug(c: str) -> str:
            s = (c or "unknown").lower()
            if "clang" in s: return "clangpp"
            if "g++" in s or "gcc" in s: return "gpp"
            if "msvc" in s: return "msvc"
            return "".join(ch for ch in s.replace("+", "p").replace(" ", "") if ch.isalnum() or ch in "-_")

          def badge_color(pct: float, status: str) -> str:
            st = (status or "").lower()
            if st in ("placeholder", "unknown", "fail", "failure", "error", "na", "n/a"):
              return "#9f9f9f"
            if pct >= 95: return "#4c1"
            if pct >= 85: return "#97CA00"
            if pct >= 70: return "#dfb317"
            if pct >= 50: return "#fe7d37"
            return "#e05d44"

          def est_w(text: str) -> int:
            return max(40, int(len(text) * 7 + 18))

          def svg_badge(label: str, msg: str, color: str) -> str:
            lw = est_w(label)
            mw = est_w(msg)
            w = lw + mw
            label_e = html.escape(label)
            msg_e = html.escape(msg)
            aria = html.escape(f"{label}: {msg}")
            lines = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="20" role="img" aria-label="{aria}">',
              '  <linearGradient id="s" x2="0" y2="100%">',
              '    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>',
              '    <stop offset="1" stop-opacity=".1"/>',
              '  </linearGradient>',
              f'  <clipPath id="r"><rect width="{w}" height="20" rx="3" fill="#fff"/></clipPath>',
              '  <g clip-path="url(#r)">',
              f'    <rect width="{lw}" height="20" fill="#555"/>',
              f'    <rect x="{lw}" width="{mw}" height="20" fill="{color}"/>',
              f'    <rect width="{w}" height="20" fill="url(#s)"/>',
              '  </g>',
              '  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">',
              f'    <text x="{lw/2}" y="14">{label_e}</text>',
              f'    <text x="{lw + mw/2}" y="14">{msg_e}</text>',
              '  </g>',
              '</svg>',
            ]
            return "\n".join(lines)

          def write_svg(path: Path, label: str, msg: str, status: str):
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text(svg_badge(label, msg, badge_color(0.0 if msg == "N/A" else float(msg.rstrip("%") or 0.0), status)), encoding="utf-8")

          out_badges = Path("dist/badges")
          out_data = Path("dist/data")
          out_badges.mkdir(parents=True, exist_ok=True)
          out_data.mkdir(parents=True, exist_ok=True)

          # cov.json files live under: _cov/<artifact_name>/cov.json (merge-multiple=false)
          cov_files = [Path(p) for p in glob.glob("_cov/**/cov.json", recursive=True)]

          # Parse all entries, keep artifact key (for alias badges like linux-gpp-cxx20-integration.svg)
          raw = []
          for p in cov_files:
            artifact_dir = p.parent.name
            key = artifact_dir[len("cpp-cov-"):] if artifact_dir.startswith("cpp-cov-") else artifact_dir
            try:
              d = json.loads(p.read_text(encoding="utf-8"))
            except Exception:
              d = {}
            os_name = str(d.get("os", "unknown"))
            comp = str(d.get("compiler", "unknown"))
            try:
              cxx = int(d.get("cxx_std", 0) or 0)
            except Exception:
              cxx = 0
            try:
              pct = float(d.get("line_pct", 0.0) or 0.0)
            except Exception:
              pct = 0.0
            status = str(d.get("status", "ok"))
            raw.append({
              "key": key,                 # e.g. linux-gpp-cxx20-integration
              "os": os_name,
              "compiler": comp,
              "compiler_slug": compiler_slug(comp),
              "cxx_std": cxx,
              "line_pct": pct,
              "status": status,
              "src": str(p),
            })

          # 1) 先生成“按 artifact key”别名 badge（用于 integration / 自定义名称）
          #    即 dist/badges/<key>.svg
          seen_keys = set()
          for e in raw:
            seen_keys.add(e["key"])
            msg = f'{e["line_pct"]:.1f}%'
            (out_badges / f'{e["key"]}.svg').write_text(
              svg_badge("cov", msg, badge_color(e["line_pct"], e["status"])),
              encoding="utf-8",
            )

          # 确保 integration badge 永远存在（即便 job 失败/缺失也不裂）
          if "linux-gpp-cxx20-integration" not in seen_keys:
            (out_badges / "linux-gpp-cxx20-integration.svg").write_text(
              svg_badge("cov", "N/A", badge_color(0.0, "na")),
              encoding="utf-8",
            )

          # 2) 再生成“规范矩阵”badge：dist/badges/{os}-{compiler_slug}-cxx{std}.svg
          #    注意：排除 integration 产物，避免污染矩阵（linux g++ cxx20 被 exclude 的话应显示 N/A）
          matrix_entries = [e for e in raw if "integration" not in e["key"]]

          def score(e):
            st = (e["status"] or "").lower()
            s = 0
            if st not in ("placeholder", "unknown", "fail", "failure", "error"):
              s += 1000
            s += e["line_pct"]
            return s

          best = {}
          for e in matrix_entries:
            k = (e["os"], e["compiler_slug"], e["cxx_std"])
            if k not in best or score(e) > score(best[k]):
              best[k] = e

          # 期望的全量组合（缺失则写 N/A，避免 README/表格裂图）
          expected = []
          for std in (11, 14, 17, 20, 23):
            expected.append(("linux", "clangpp", std))
            expected.append(("linux", "gpp", std))
            expected.append(("macos", "clangpp", std))
            expected.append(("macos", "gpp", std))
            expected.append(("windows", "msvc", std))

          selected = []
          for (osn, cs, std) in expected:
            k = (osn, cs, std)
            if k in best:
              e = best[k]
              msg = f'{e["line_pct"]:.1f}%'
              (out_badges / f"{osn}-{cs}-cxx{std}.svg").write_text(
                svg_badge("cov", msg, badge_color(e["line_pct"], e["status"])),
                encoding="utf-8",
              )
              selected.append(e)
            else:
              (out_badges / f"{osn}-{cs}-cxx{std}.svg").write_text(
                svg_badge("cov", "N/A", badge_color(0.0, "na")),
                encoding="utf-8",
              )

          # 3) overall：只基于矩阵 best（非 placeholder）
          real = [e["line_pct"] for e in selected if (e["status"] or "").lower() not in ("placeholder","unknown","fail","failure","error")]
          overall = statistics.mean(real) if real else 0.0
          (out_badges / "overall.svg").write_text(
            svg_badge("cov", f"{overall:.1f}%", badge_color(overall, "ok" if real else "placeholder")),
            encoding="utf-8",
          )

          # 4) data + index.html（相对路径，适配 /common/ 子路径）
          data_entries = []
          for (osn, cs, std) in expected:
            e = best.get((osn, cs, std))
            if e:
              data_entries.append(e)
            else:
              data_entries.append({
                "key": f"{osn}-{cs}-cxx{std}",
                "os": osn,
                "compiler": cs,
                "compiler_slug": cs,
                "cxx_std": std,
                "line_pct": 0.0,
                "status": "na",
                "src": "",
              })

          (out_data / "coverage.json").write_text(
            json.dumps({"overall": overall, "entries": data_entries}, ensure_ascii=False, indent=2),
            encoding="utf-8",
          )

          os_list = ["linux", "macos", "windows"]
          stds = [11, 14, 17, 20, 23]
          comp_by_os = {"linux": ["clangpp", "gpp"], "macos": ["clangpp", "gpp"], "windows": ["msvc"]}

          def cell(osn, cs, st):
            fn = f"badges/{osn}-{cs}-cxx{st}.svg"
            return f'<img alt="{osn}-{cs}-cxx{st}" src="{fn}">'

          rows = []
          for osn in os_list:
            for cs in comp_by_os[osn]:
              tds = "".join(f"<td>{cell(osn, cs, st)}</td>" for st in stds)
              rows.append(f"<tr><th>{osn} / {cs}</th>{tds}</tr>")

          index = f"""<!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>C++ Coverage</title>
          <h1>C++ Coverage</h1>
          <p><img alt="overall" src="badges/overall.svg"></p>

          <h2>Matrix</h2>
          <table border="1" cellpadding="6" cellspacing="0">
            <thead>
              <tr><th>platform / compiler</th><th>C++11</th><th>C++14</th><th>C++17</th><th>C++20</th><th>C++23</th></tr>
            </thead>
            <tbody>
              {''.join(rows)}
            </tbody>
          </table>

          <h2>Integration</h2>
          <p><img alt="linux-gpp-cxx20-integration" src="badges/linux-gpp-cxx20-integration.svg"></p>

          <p>Data: <a href="data/coverage.json">coverage.json</a></p>
          """
          Path("dist").mkdir(parents=True, exist_ok=True)
          Path("dist/index.html").write_text(index, encoding="utf-8")
          Path("dist/.nojekyll").write_text("", encoding="utf-8")

          # 可选：给 walkthrough endpoint 兜底，避免 shields 显示 resource not found（两种常见路径都写）
          walkthrough = {"schemaVersion": 1, "label": "walkthrough", "message": "N/A", "color": "9f9f9f"}
          Path("dist/walkthrough.json").write_text(json.dumps(walkthrough, ensure_ascii=False), encoding="utf-8")
          Path("dist/data/walkthrough.json").write_text(json.dumps(walkthrough, ensure_ascii=False), encoding="utf-8")

          print(f"cov.json found={len(cov_files)} overall={overall:.2f}% badges_dir={out_badges}")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
