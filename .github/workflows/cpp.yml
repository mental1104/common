name: Finalize C++ token bucket PR

on:
  push:
    branches:
      - feature/cpp-token-bucket
    paths:
      - .github/workflows/cpp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cpp-token-bucket
          fetch-depth: 0
      - name: Finalize documentation and clean temporary files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("cpp/README.md")
          text = readme.read_text(encoding="utf-8")

          anchor = "| 并发 | `sleep_for`, `sleep_for_ms`, `ThreadPool` | 函数 / 类 | `mental1104/concurrency/thread/thread_util.h` | 睡眠辅助函数和返回 future 的线程池。 |"
          row = "| 并发 | `TokenBucket`, `CancellationToken` | 类 | `mental1104/concurrency/token_bucket.h` | 单进程内阻塞获取令牌，并支持可唤醒取消。 |"
          if row not in text:
              if anchor not in text:
                  raise SystemExit("C++ README index anchor not found")
              text = text.replace(anchor, anchor + "\n" + row, 1)

          section = '''

### `TokenBucket` 和 `CancellationToken`

- **类别：** 并发与限流
- **类型：** 类
- **定义位置：** `cpp/include/mental1104/concurrency/token_bucket.h`
- **包含：** `#include "mental1104/concurrency/token_bucket.h"`
- **用途：** 在单个 C++ 进程内按长期速率和突发容量阻塞获取执行资格；等待过程可通过可唤醒的取消令牌终止。

**基础用法：**

```cpp
#include "mental1104/concurrency/token_bucket.h"

int main() {
  mental1104::TokenBucket bucket(20.0, 3);
  mental1104::CancellationToken cancellation;

  if (!bucket.acquire(&cancellation)) {
    return 1;
  }

  // 执行受限操作。
  bucket.release();
  return 0;
}
```

**示例结果：**

```text
无标准输出；成功获取令牌时 acquire 返回 true，被取消时返回 false。
```

**备注：**

- 创建时为满桶；`acquire` 每次消费一个令牌，令牌通过 `std::chrono::steady_clock` 按需补充，不创建后台线程。
- `release` 是空操作，完成任务后不会归还速率额度。
- `CancellationToken::cancel()` 会唤醒正在等待的线程；取消路径不消费令牌。
- 实现兼容 C++11 至 C++23；状态仅在单进程内有效，不保证严格公平，也不提供 `try_acquire`、批量获取或指标。
'''
          if "### `TokenBucket` 和 `CancellationToken`" not in text:
              text = text.rstrip() + section + "\n"

          readme.write_text(text, encoding="utf-8")
          PY

          cat > cpp/test/concurrency/test_token_bucket.cpp <<'CPP'
          #include "mental1104/concurrency/token_bucket.h"

          #include <atomic>
          #include <chrono>
          #include <gtest/gtest.h>
          #include <limits>
          #include <thread>
          #include <vector>

          TEST(TokenBucketTest, RejectsInvalidConfiguration) {
            EXPECT_THROW(mental1104::TokenBucket(0.0, 1), std::invalid_argument);
            EXPECT_THROW(mental1104::TokenBucket(-1.0, 1), std::invalid_argument);
            EXPECT_THROW(mental1104::TokenBucket(
                             std::numeric_limits<double>::quiet_NaN(), 1),
                         std::invalid_argument);
            EXPECT_THROW(mental1104::TokenBucket(
                             std::numeric_limits<double>::infinity(), 1),
                         std::invalid_argument);
            EXPECT_THROW(mental1104::TokenBucket(1.0, 0), std::invalid_argument);
          }

          TEST(TokenBucketTest, StartsFullAndReplenishesLazily) {
            mental1104::TokenBucket bucket(20.0, 2);
            EXPECT_TRUE(bucket.acquire());
            EXPECT_TRUE(bucket.acquire());

            const std::chrono::steady_clock::time_point started =
                std::chrono::steady_clock::now();
            EXPECT_TRUE(bucket.acquire());
            const std::chrono::milliseconds elapsed =
                std::chrono::duration_cast<std::chrono::milliseconds>(
                    std::chrono::steady_clock::now() - started);

            EXPECT_GE(elapsed.count(), 30);
            EXPECT_LT(elapsed.count(), 500);
          }

          TEST(TokenBucketTest, ReleaseDoesNotReturnToken) {
            mental1104::TokenBucket bucket(0.1, 1);
            EXPECT_TRUE(bucket.acquire());
            bucket.release();

            mental1104::CancellationToken cancellation;
            cancellation.cancel();
            EXPECT_FALSE(bucket.acquire(&cancellation));
          }

          TEST(TokenBucketTest, CancellationWakesWaiter) {
            mental1104::TokenBucket bucket(0.1, 1);
            ASSERT_TRUE(bucket.acquire());

            mental1104::CancellationToken cancellation;
            std::atomic<bool> result(true);
            std::thread waiter([&] { result.store(bucket.acquire(&cancellation)); });

            std::this_thread::sleep_for(std::chrono::milliseconds(30));
            cancellation.cancel();
            waiter.join();

            EXPECT_FALSE(result.load());
          }

          TEST(TokenBucketTest, ConcurrentWaitersDoNotShareToken) {
            mental1104::TokenBucket bucket(0.01, 1);
            mental1104::CancellationToken cancellation;
            std::atomic<int> acquired(0);
            std::atomic<int> ready(0);
            std::atomic<bool> start(false);
            std::vector<std::thread> threads;

            for (int i = 0; i < 4; ++i) {
              threads.push_back(std::thread([&] {
                ready.fetch_add(1);
                while (!start.load()) {
                  std::this_thread::yield();
                }
                if (bucket.acquire(&cancellation)) {
                  acquired.fetch_add(1);
                }
              }));
            }

            while (ready.load() != 4) {
              std::this_thread::yield();
            }
            start.store(true);

            const std::chrono::steady_clock::time_point deadline =
                std::chrono::steady_clock::now() + std::chrono::milliseconds(500);
            while (acquired.load() == 0 &&
                   std::chrono::steady_clock::now() < deadline) {
              std::this_thread::sleep_for(std::chrono::milliseconds(1));
            }
            cancellation.cancel();

            for (std::size_t i = 0; i < threads.size(); ++i) {
              threads[i].join();
            }

            EXPECT_EQ(acquired.load(), 1);
          }
          CPP

          rm -f .github/workflows/append-cpp-token-bucket-docs.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/cpp.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cpp/README.md cpp/test/concurrency/test_token_bucket.cpp .github/workflows/cpp.yml
          git add -u .github/workflows
          git commit -m "docs(cpp): finalize token bucket documentation"
          git push origin HEAD:feature/cpp-token-bucket
