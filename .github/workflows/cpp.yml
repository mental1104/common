name: C++

on:
  push:
    paths:
      - "cpp/**"
      - "devops/**"
      - ".github/workflows/cpp.yml"
  pull_request:
    paths:
      - "cpp/**"
      - "devops/**"
      - ".github/workflows/cpp.yml"
  workflow_dispatch:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true

env:
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/devops"
  CTEST_V: "${{ (vars.CI_VERBOSE_LOGS == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verbose_logs == false || github.event.inputs.verbose_logs == 'false'))) && '' || '-V' }}"

jobs:
  linux:
    name: Linux / ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} / C++${{ matrix.cxx_std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        cxx_std: ["11", "14", "17", "20", "23"]
        exclude:
          - compiler: gcc
            cxx_std: "20"
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: ${{ matrix.compiler == 'clang' && 'llvm-cov gcov' || 'gcov' }}
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      CXX_STD: ${{ matrix.cxx_std }}
      # 用于文件名/URL，避免 "++"
      COMPILER_KEY: ${{ matrix.compiler == 'clang' && 'clangpp' || 'gpp' }}
      # 用于 cov.json 里展示
      COMPILER_LABEL: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Install toolchain
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang clang-format clang-tidy gcovr lcov \
            libmpfr-dev libgmp-dev

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Format C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev fmt-cpp

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage.py \
            --os linux \
            --compiler "${COMPILER_LABEL}" \
            --cxx-std ${{ matrix.cxx_std }} \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'linux','compiler':os.getenv('COMPILER_LABEL','unknown'),'cxx_std':int('${{ matrix.cxx_std }}'),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="linux-${COMPILER_KEY}-cxx${{ matrix.cxx_std }}"
          mkdir -p "_cov/${key}"
          cp -f cov.json "_cov/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-linux-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          path: _cov/linux-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          retention-days: 7
          if-no-files-found: warn

      - name: Vet C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev vet-cpp

      - name: Guard C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev guard-cpp

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  linux-integration:
    name: Linux / g++ / C++20 / coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s --health-timeout=5s --health-retries=55
      redis:
        image: redis/redis-stack-server:7.2.0-v7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=5
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: gcov
      CC: gcc
      CXX: g++
      CXX_STD: "20"
      DATABASE_URL: postgresql://test:test@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: app
      PGHOST: localhost
      PGPORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      PULSAR_HOST: localhost
      PULSAR_BROKER_PORT: "6650"
      PULSAR_ADMIN_PORT: "8080"
      PULSAR_TOKEN: ""
      PULSAR_SCHEMA_PATH: "/tmp/pulsar/schema"
      PULSAR_DATA_PATH: "/tmp/pulsar/data"
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Start Pulsar (standalone -nss)
        id: pulsar
        continue-on-error: true
        run: |
          docker rm -f pulsar || true
          docker run -d --name pulsar \
            -p ${PULSAR_BROKER_PORT}:${PULSAR_BROKER_PORT} -p ${PULSAR_ADMIN_PORT}:${PULSAR_ADMIN_PORT} \
            apachepulsar/pulsar:3.2.0 \
            bin/pulsar standalone -nss

      - name: Wait for postgres/redis/pulsar
        id: wait_services
        continue-on-error: true
        run: |
          for i in {1..40}; do
            (echo > /dev/tcp/127.0.0.1/${PGPORT}) && (echo > /dev/tcp/127.0.0.1/${REDIS_PORT}) && (echo > /dev/tcp/127.0.0.1/${PULSAR_ADMIN_PORT}) && exit 0
            sleep 2
          done
          echo "services not ready" >&2
          exit 1

      - name: Install toolchain
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang clang-format clang-tidy gcovr lcov \
            libmpfr-dev libgmp-dev

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Test redis-plus-plus
        id: test_redispp
        continue-on-error: true
        run: ./dev test-redispp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage.py \
            --os linux \
            --compiler g++ \
            --cxx-std 20 \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'linux','compiler':'g++','cxx_std':20,'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="linux-gpp-cxx20-integration"
          mkdir -p "_cov/${key}"
          cp -f cov.json "_cov/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-linux-gpp-cxx20-integration
          path: _cov/linux-gpp-cxx20-integration
          retention-days: 7
          if-no-files-found: warn

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' || steps.wait_services.outcome == 'failure' }}
        run: exit 1

  macos:
    name: macOS / ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} / C++${{ matrix.cxx_std }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        cxx_std: ["11", "14", "17", "20", "23"]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      CXX_STD: ${{ matrix.cxx_std }}
      GCOV: "llvm-cov gcov"
      COMPILER_KEY: ${{ matrix.compiler == 'clang' && 'clangpp' || 'gpp' }}
      COMPILER_LABEL: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Install toolchain
        continue-on-error: true
        run: |
          brew update
          brew install cmake llvm ninja gcovr lcov mpfr gmp gcc
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage.py \
            --os macos \
            --compiler "${COMPILER_LABEL}" \
            --cxx-std ${{ matrix.cxx_std }} \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'macos','compiler':os.getenv('COMPILER_LABEL','unknown'),'cxx_std':int('${{ matrix.cxx_std }}'),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="macos-${COMPILER_KEY}-cxx${{ matrix.cxx_std }}"
          mkdir -p "_cov/${key}"
          cp -f cov.json "_cov/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-macos-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          path: _cov/macos-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          retention-days: 7
          if-no-files-found: warn

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  windows:
    name: Windows / MSVC / C++${{ matrix.cxx_std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cxx_std: ["11", "14", "17", "20", "23"]
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}/devops
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CXX_STD: ${{ matrix.cxx_std }}
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        id: init_submodules
        continue-on-error: true
        run: python -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: python -m devtool.cli setup-cpp --config Debug

      - name: Build export C++ layer
        id: build_export
        continue-on-error: true
        run: python -m devtool.cli build-export-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: python -m devtool.cli build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: python -m devtool.cli coverage-cpp

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          python tools/ci/extract_coverage.py `
            --os windows `
            --compiler msvc `
            --cxx-std ${{ matrix.cxx_std }} `
            --out cov.json

          if (-not (Test-Path cov.json)) {
            python -c "import json,os; obj={'os':'windows','compiler':'msvc','cxx_std':int(os.getenv('CXX_STD','0') or 0),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'}; json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          }

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          $key = "windows-msvc-cxx${{ matrix.cxx_std }}"
          New-Item -ItemType Directory -Force -Path "_cov/$key" | Out-Null
          Copy-Item -Force cov.json "_cov/$key/cov.json" -ErrorAction SilentlyContinue

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-windows-msvc-cxx${{ matrix.cxx_std }}
          path: _cov/windows-msvc-cxx${{ matrix.cxx_std }}
          retention-days: 7
          if-no-files-found: warn

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  pages:
    name: Pages / C++ coverage dashboard
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: [linux, linux-integration, macos, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: _cov
          pattern: cpp-cov-*
          merge-multiple: true

      - name: Build coverage site (dist/)
        id: build_site
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, os, statistics, html

          def compiler_slug(c: str) -> str:
            s = (c or "unknown").lower()
            if "clang" in s:
              return "clangpp"
            if "g++" in s or s == "gpp" or "gcc" in s:
              return "gpp"
            if "msvc" in s:
              return "msvc"
            return "".join(ch for ch in s.replace("+", "p").replace(" ", "") if ch.isalnum() or ch in "-_")

          def badge_color(pct: float, status: str) -> str:
            st = (status or "").lower()
            if st in ("placeholder", "unknown", "fail", "failure", "error"):
              return "#9f9f9f"
            if pct >= 95: return "#4c1"
            if pct >= 85: return "#97CA00"
            if pct >= 70: return "#dfb317"
            if pct >= 50: return "#fe7d37"
            return "#e05d44"

          def est_w(text: str) -> int:
            return max(40, int(len(text) * 7 + 18))

          def svg_badge(label: str, msg: str, color: str) -> str:
            lw = est_w(label)
            mw = est_w(msg)
            w = lw + mw
            label_e = html.escape(label)
            msg_e = html.escape(msg)
            aria = html.escape(f"{label}: {msg}")
            lines = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="20" role="img" aria-label="{aria}">',
              '  <linearGradient id="s" x2="0" y2="100%">',
              '    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>',
              '    <stop offset="1" stop-opacity=".1"/>',
              '  </linearGradient>',
              f'  <clipPath id="r"><rect width="{w}" height="20" rx="3" fill="#fff"/></clipPath>',
              '  <g clip-path="url(#r)">',
              f'    <rect width="{lw}" height="20" fill="#555"/>',
              f'    <rect x="{lw}" width="{mw}" height="20" fill="{color}"/>',
              f'    <rect width="{w}" height="20" fill="url(#s)"/>',
              '  </g>',
              '  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">',
              f'    <text x="{lw/2}" y="14">{label_e}</text>',
              f'    <text x="{lw + mw/2}" y="14">{msg_e}</text>',
              '  </g>',
              '</svg>',
            ]
            return "\n".join(lines)

          # Collect cov.json recursively (your artifacts store them under _cov/<key>/cov.json)
          paths = glob.glob("_cov/**/cov.json", recursive=True)

          entries = []
          for p in paths:
            try:
              d = json.load(open(p, "r", encoding="utf-8"))
            except Exception:
              continue
            os_name = str(d.get("os", "unknown"))
            comp = str(d.get("compiler", "unknown"))
            try:
              cxx = int(d.get("cxx_std", 0) or 0)
            except Exception:
              cxx = 0
            try:
              pct = float(d.get("line_pct", 0.0) or 0.0)
            except Exception:
              pct = 0.0
            status = str(d.get("status", "ok"))
            entries.append({
              "os": os_name,
              "compiler": comp,
              "compiler_slug": compiler_slug(comp),
              "cxx_std": cxx,
              "line_pct": pct,
              "status": status,
              "src": p,
            })

          os.makedirs("dist/badges", exist_ok=True)
          os.makedirs("dist/data", exist_ok=True)

          # Keep best entry per (os, compiler_slug, cxx_std)
          def score(e):
            st = (e["status"] or "").lower()
            s = 0
            if st not in ("placeholder", "unknown", "fail", "failure", "error"):
              s += 1000
            s += e["line_pct"]
            return s

          best = {}
          for e in entries:
            k = (e["os"], e["compiler_slug"], e["cxx_std"])
            if k not in best or score(e) > score(best[k]):
              best[k] = e

          selected = list(best.values())

          # Write per-combo badges
          for e in selected:
            out = f'dist/badges/{e["os"]}-{e["compiler_slug"]}-cxx{e["cxx_std"]}.svg'
            msg = f'{e["line_pct"]:.1f}%'
            color = badge_color(e["line_pct"], e["status"])
            open(out, "w", encoding="utf-8").write(svg_badge("cov", msg, color))

          # Overall badge (simple mean of non-placeholder entries)
          real = [e["line_pct"] for e in selected if (e["status"] or "").lower() not in ("placeholder","unknown","fail","failure","error")]
          overall = statistics.mean(real) if real else 0.0
          open("dist/badges/overall.svg", "w", encoding="utf-8").write(
            svg_badge("cov", f"{overall:.1f}%", badge_color(overall, "ok" if real else "placeholder"))
          )

          # Data json
          json.dump(
            {"overall": overall, "entries": sorted(selected, key=lambda x: (x["os"], x["compiler_slug"], x["cxx_std"]))},
            open("dist/data/coverage.json", "w", encoding="utf-8"),
            ensure_ascii=False,
            indent=2,
          )

          # Index page (fixed matrix)
          os_list = ["linux", "macos", "windows"]
          stds = [11, 14, 17, 20, 23]
          comp_by_os = {"linux": ["clangpp", "gpp"], "macos": ["clangpp", "gpp"], "windows": ["msvc"]}

          def cell(osn, cs, st):
            fn = f"badges/{osn}-{cs}-cxx{st}.svg"
            return f'<a href="./"><img alt="{osn}-{cs}-cxx{st}" src="{fn}"></a>'

          rows = []
          for osn in os_list:
            for cs in comp_by_os[osn]:
              tds = "".join(f"<td>{cell(osn, cs, st)}</td>" for st in stds)
              rows.append(f"<tr><th>{osn} / {cs}</th>{tds}</tr>")

          index = f"""<!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>C++ Coverage</title>
          <h1>C++ Coverage</h1>
          <p><a href="./"><img alt="overall" src="badges/overall.svg"></a></p>
          <table border="1" cellpadding="6" cellspacing="0">
            <thead>
              <tr><th>platform / compiler</th><th>C++11</th><th>C++14</th><th>C++17</th><th>C++20</th><th>C++23</th></tr>
            </thead>
            <tbody>
              {''.join(rows)}
            </tbody>
          </table>
          <p>Data: <a href="data/coverage.json">coverage.json</a></p>
          """
          open("dist/index.html", "w", encoding="utf-8").write(index)
          open("dist/.nojekyll", "w", encoding="utf-8").write("")

          print(f"cov.json found={len(paths)} selected={len(selected)} overall={overall:.2f}%")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
