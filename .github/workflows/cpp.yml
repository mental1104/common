name: C++

on:
  push:
    paths:
      - "cpp/**"
      - "devops/**"
      - ".github/workflows/cpp.yml"
  pull_request:
    paths:
      - "cpp/**"
      - "devops/**"
      - ".github/workflows/cpp.yml"
  workflow_dispatch:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true

env:
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/devops"
  CTEST_V: "${{ (vars.CI_VERBOSE_LOGS == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verbose_logs == false || github.event.inputs.verbose_logs == 'false'))) && '' || '-V' }}"

jobs:
  linux:
    name: Linux / ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} / C++${{ matrix.cxx_std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        cxx_std: ["11", "14", "17", "20", "23"]
        exclude:
          - compiler: gcc
            cxx_std: "20"
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: ${{ matrix.compiler == 'clang' && 'llvm-cov gcov' || 'gcov' }}
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      CXX_STD: ${{ matrix.cxx_std }}
      # 用于文件名/URL，避免 "++" 这种不安全字符
      COMPILER_KEY: ${{ matrix.compiler == 'clang' && 'clangpp' || 'gpp' }}
      # 用于 cov.json 字段展示
      COMPILER_LABEL: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Install toolchain
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang clang-format clang-tidy gcovr lcov \
            libmpfr-dev libgmp-dev

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Format C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev fmt-cpp

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage.py \
            --os linux \
            --compiler "${COMPILER_LABEL}" \
            --cxx-std ${{ matrix.cxx_std }} \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'linux','compiler':os.getenv('COMPILER_LABEL','unknown'),'cxx_std':int('${{ matrix.cxx_std }}'),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2);print('coverage placeholder line_pct=0.00% source=placeholder')"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="linux-${COMPILER_KEY}-cxx${{ matrix.cxx_std }}"
          mkdir -p "_cov/${key}"
          cp -f cov.json "_cov/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-linux-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          path: _cov/linux-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          retention-days: 7
          if-no-files-found: warn

      - name: Vet C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev vet-cpp

      - name: Guard C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev guard-cpp

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  linux-integration:
    name: Linux / g++ / C++20 / coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s --health-timeout=5s --health-retries=55
      redis:
        image: redis/redis-stack-server:7.2.0-v7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=5
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: gcov
      CC: gcc
      CXX: g++
      CXX_STD: "20"
      COMPILER_KEY: "gpp"
      COMPILER_LABEL: "g++"
      DATABASE_URL: postgresql://test:test@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: app
      PGHOST: localhost
      PGPORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      PULSAR_HOST: localhost
      PULSAR_BROKER_PORT: "6650"
      PULSAR_ADMIN_PORT: "8080"
      PULSAR_TOKEN: ""
      PULSAR_SCHEMA_PATH: "/tmp/pulsar/schema"
      PULSAR_DATA_PATH: "/tmp/pulsar/data"
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Start Pulsar (standalone -nss)
        id: pulsar
        continue-on-error: true
        run: |
          docker rm -f pulsar || true
          docker run -d --name pulsar \
            -p ${PULSAR_BROKER_PORT}:${PULSAR_BROKER_PORT} -p ${PULSAR_ADMIN_PORT}:${PULSAR_ADMIN_PORT} \
            apachepulsar/pulsar:3.2.0 \
            bin/pulsar standalone -nss

      - name: Wait for postgres/redis/pulsar
        id: wait_services
        continue-on-error: true
        run: |
          for i in {1..40}; do
            (echo > /dev/tcp/127.0.0.1/${PGPORT}) && (echo > /dev/tcp/127.0.0.1/${REDIS_PORT}) && (echo > /dev/tcp/127.0.0.1/${PULSAR_ADMIN_PORT}) && exit 0
            sleep 2
          done
          echo "services not ready" >&2
          exit 1

      - name: Install toolchain
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang clang-format clang-tidy gcovr lcov \
            libmpfr-dev libgmp-dev

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Test redis-plus-plus
        id: test_redispp
        continue-on-error: true
        run: ./dev test-redispp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage.py \
            --os linux \
            --compiler "${COMPILER_LABEL}" \
            --cxx-std 20 \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'linux','compiler':os.getenv('COMPILER_LABEL','g++'),'cxx_std':20,'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2);print('coverage placeholder line_pct=0.00% source=placeholder')"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="linux-${COMPILER_KEY}-cxx20-integration"
          mkdir -p "_cov/${key}"
          cp -f cov.json "_cov/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-linux-gpp-cxx20-integration
          path: _cov/linux-gpp-cxx20-integration
          retention-days: 7
          if-no-files-found: warn

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' || steps.wait_services.outcome == 'failure' }}
        run: exit 1

  macos:
    name: macOS / ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} / C++${{ matrix.cxx_std }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        cxx_std: ["11", "14", "17", "20", "23"]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      CXX_STD: ${{ matrix.cxx_std }}
      GCOV: "llvm-cov gcov"
      COMPILER_KEY: ${{ matrix.compiler == 'clang' && 'clangpp' || 'gpp' }}
      COMPILER_LABEL: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Install toolchain
        continue-on-error: true
        run: |
          brew update
          brew install cmake llvm ninja gcovr lcov mpfr gmp gcc
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage.py \
            --os macos \
            --compiler "${COMPILER_LABEL}" \
            --cxx-std ${{ matrix.cxx_std }} \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'macos','compiler':os.getenv('COMPILER_LABEL','unknown'),'cxx_std':int('${{ matrix.cxx_std }}'),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2);print('coverage placeholder line_pct=0.00% source=placeholder')"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="macos-${COMPILER_KEY}-cxx${{ matrix.cxx_std }}"
          mkdir -p "_cov/${key}"
          cp -f cov.json "_cov/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-macos-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          path: _cov/macos-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          retention-days: 7
          if-no-files-found: warn

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  windows:
    name: Windows / MSVC / C++${{ matrix.cxx_std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cxx_std: ["11", "14", "17", "20", "23"]
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}/devops
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CXX_STD: ${{ matrix.cxx_std }}
      COMPILER_KEY: "msvc"
      COMPILER_LABEL: "msvc"
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        id: init_submodules
        continue-on-error: true
        run: python -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: python -m devtool.cli setup-cpp --config Debug

      - name: Build export C++ layer
        id: build_export
        continue-on-error: true
        run: python -m devtool.cli build-export-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: python -m devtool.cli build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: python -m devtool.cli coverage-cpp

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          python tools/ci/extract_coverage.py `
            --os windows `
            --compiler msvc `
            --cxx-std ${{ matrix.cxx_std }} `
            --out cov.json

          if (-not (Test-Path cov.json)) {
            python -c "import json,os; obj={'os':'windows','compiler':'msvc','cxx_std':int(os.getenv('CXX_STD','0') or 0),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'}; json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2); print('coverage placeholder line_pct=0.00% source=placeholder')"
          }

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          $key = "windows-msvc-cxx${{ matrix.cxx_std }}"
          New-Item -ItemType Directory -Force -Path "_cov/$key" | Out-Null
          if (Test-Path "cov.json") { Copy-Item -Force "cov.json" "_cov/$key/cov.json" }

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-windows-msvc-cxx${{ matrix.cxx_std }}
          path: _cov/windows-msvc-cxx${{ matrix.cxx_std }}
          retention-days: 7
          if-no-files-found: warn

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  pages:
    name: Pages / C++ coverage dashboard
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: [linux, linux-integration, macos, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"

      - name: Download coverage artifacts (never block)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: _cov_raw
          pattern: cpp-cov-*
          merge-multiple: true

      - name: Flatten cov.json inputs
        if: always()
        continue-on-error: true
        run: |
          set -e
          mkdir -p _cov_flat
          python3 - <<'PY'
          import pathlib, shutil
          src = pathlib.Path("_cov_raw")
          dst = pathlib.Path("_cov_flat")
          dst.mkdir(parents=True, exist_ok=True)

          found = 0
          for p in src.rglob("cov.json"):
            key = p.parent.name
            shutil.copy2(p, dst / f"{key}.json")
            found += 1

          if found == 0:
            # placeholder：保证后续脚本不崩
            (dst / "placeholder.json").write_text(
              '{"os":"unknown","compiler":"unknown","cxx_std":0,"line_pct":0.0,"source":"placeholder","sha":"","run_id":"","status":"placeholder"}',
              encoding="utf-8"
            )
          print(f"flattened cov.json files: {found}")
          PY

      - name: Build coverage site (dist/) (never block)
        id: build_site
        continue-on-error: true
        run: |
          python3 tools/ci/build_cpp_coverage_site.py --cov-dir _cov_flat --out-dir dist

      - name: Generate per-job badges (dist/badges/*.svg)
        if: always()
        continue-on-error: true
        run: |
          set -e
          mkdir -p dist/badges
          python3 - <<'PY'
          import json, math, pathlib

          cov_dir = pathlib.Path("_cov_flat")
          out_dir = pathlib.Path("dist/badges")
          out_dir.mkdir(parents=True, exist_ok=True)

          def pick_color(pct: float) -> str:
            if pct >= 90: return "#2da44e"
            if pct >= 80: return "#6fdd8b"
            if pct >= 70: return "#d4a72c"
            if pct >= 60: return "#db6d28"
            return "#d1242f"

          def svg_badge(label: str, value: str, color: str) -> str:
            # 简单静态 badge（固定宽度，足够稳定）
            # label/value 过长会溢出：这里用固定宽度 + 省略号防炸
            def clip(s, n=28):
              return s if len(s) <= n else (s[:n-1] + "…")
            label = clip(label, 28)
            value = clip(value, 16)

            return f'''<svg xmlns="http://www.w3.org/2000/svg" width="320" height="20" role="img" aria-label="{label}: {value}">
              <linearGradient id="s" x2="0" y2="100%">
                <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
                <stop offset=".1" stop-color="#aaa" stop-opacity=".1"/>
                <stop offset=".9" stop-color="#000" stop-opacity=".3"/>
                <stop offset="1" stop-color="#000" stop-opacity=".5"/>
              </linearGradient>
              <mask id="m">
                <rect width="320" height="20" rx="3" fill="#fff"/>
              </mask>
              <g mask="url(#m)">
                <rect width="220" height="20" fill="#24292f"/>
                <rect x="220" width="100" height="20" fill="{color}"/>
                <rect width="320" height="20" fill="url(#s)"/>
              </g>
              <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
                <text x="110" y="14">{label}</text>
                <text x="270" y="14">{value}</text>
              </g>
            </svg>'''

          # 逐 job badge：文件名就是 key（linux-clangpp-cxx14 等）
          total = []
          for p in sorted(cov_dir.glob("*.json")):
            key = p.stem
            try:
              obj = json.loads(p.read_text(encoding="utf-8"))
              pct = float(obj.get("line_pct", 0.0) or 0.0)
            except Exception:
              pct = 0.0
            total.append(pct)

            label = key
            value = f"{pct:.2f}%"
            (out_dir / f"{key}.svg").write_text(svg_badge(label, value, pick_color(pct)), encoding="utf-8")

          # overall（简单平均；如果你想按 LOC 加权，需要你在 cov.json 里提供 lines-valid/covered）
          avg = sum(total) / len(total) if total else 0.0
          (out_dir / "overall.svg").write_text(svg_badge("cpp coverage overall", f"{avg:.2f}%", pick_color(avg)), encoding="utf-8")
          PY

      - name: Ensure dist exists
        if: always()
        run: |
          set -e
          if [ ! -d dist ]; then
            mkdir -p dist
            printf '%s\n' \
              '<!doctype html><meta charset="utf-8"><title>Coverage</title>' \
              '<h1>Coverage site build failed</h1>' \
              '<p>Please check CI logs. This deployment is a placeholder.</p>' \
              > dist/index.html
          fi

      - name: Upload Pages artifact (never block)
        if: always()
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages (never block)
        if: always()
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
