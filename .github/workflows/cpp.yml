name: cpp

on:
  workflow_call:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true
  push:
    branches-ignore:
      - main
    paths:
      - "cpp/**"
      - "devops/**"
      - ".github/workflows/cpp.yml"
  pull_request:
    paths:
      - "cpp/**"
      - "devops/**"
      - ".github/workflows/cpp.yml"
  workflow_dispatch:
    inputs:
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true

env:
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/devops"
  CTEST_V: "${{ (vars.CI_VERBOSE_LOGS == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verbose_logs == false || github.event.inputs.verbose_logs == 'false')) || (github.event_name == 'workflow_call' && (inputs.verbose_logs == false || inputs.verbose_logs == 'false'))) && '' || '-V' }}"

jobs:
  linux:
    name: Linux / ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} / C++${{ matrix.cxx_std }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis/redis-stack-server:7.2.0-v7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        cxx_std: ["11", "14", "17", "20", "23"]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: gcov
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      CXX_STD: ${{ matrix.cxx_std }}
      # 用于文件名/URL，避免 "++"
      COMPILER_KEY: ${{ matrix.compiler == 'clang' && 'clangpp' || 'gpp' }}
      # 用于 cov.json 里展示
      COMPILER_LABEL: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Wait for redis
        run: |
          for i in {1..40}; do
            (echo > /dev/tcp/127.0.0.1/${REDIS_PORT}) && exit 0
            sleep 2
          done
          echo "redis not ready" >&2
          exit 1

      - name: Install toolchain
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang clang-format clang-tidy gcovr lcov \
            libmpfr-dev libgmp-dev

      - name: Install llvm tools for clang
        if: ${{ matrix.compiler == 'clang' }}
        run: |
          clang_major="$(clang --version | head -n1 | sed -E 's/.*version ([0-9]+).*/\1/')"
          if [ -z "${clang_major}" ]; then
            echo "failed to detect clang major version" >&2
            exit 1
          fi
          sudo apt-get install -y "llvm-${clang_major}-tools"
          echo "GCOV=llvm-cov-${clang_major} gcov" >> "$GITHUB_ENV"

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Format C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev fmt-cpp

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage_cpp.py \
            --os linux \
            --compiler "${COMPILER_LABEL}" \
            --cxx-std ${{ matrix.cxx_std }} \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'linux','compiler':os.getenv('COMPILER_LABEL','unknown'),'cxx_std':int('${{ matrix.cxx_std }}'),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="linux-${COMPILER_KEY}-cxx${{ matrix.cxx_std }}"
          mkdir -p "_cov/cpp/${key}"
          cp -f cov.json "_cov/cpp/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/cpp/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-linux-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn

      - name: Vet C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev vet-cpp

      - name: Guard C++
        if: ${{ matrix.compiler == 'gcc' && matrix.cxx_std == '23' }}
        continue-on-error: true
        run: ./dev guard-cpp

      - name: install-cpp
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
        run: ./dev install-cpp

      - name: verify-install-cpp
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
        run: ./dev verify-install cpp

      - name: uninstall-cpp
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
        run: ./dev uninstall-cpp

      - name: verify-uninstall-cpp (expect failure)
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
          VERIFY_REQUIRE_INSTALL: "1"
        run: |
          set +e
          ./dev verify-install cpp
          status=$?
          if [ $status -eq 0 ]; then
            echo "verify-install succeeded after uninstall; expected failure"
            exit 1
          fi

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  macos:
    name: macOS / ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} / C++${{ matrix.cxx_std }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        cxx_std: ["11", "14", "17", "20", "23"]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      CXX_STD: ${{ matrix.cxx_std }}
      GCOV: "llvm-cov gcov"
      COMPILER_KEY: ${{ matrix.compiler == 'clang' && 'clangpp' || 'gpp' }}
      COMPILER_LABEL: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Install toolchain
        continue-on-error: true
        run: |
          brew update
          brew install cmake llvm ninja gcovr lcov mpfr gmp gcc
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: ./dev setup-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: ./dev build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: ./dev coverage-cpp

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          rm -f coverage.xml

          if [ -d cpp/build ]; then
            gcovr -r . cpp/build \
              --object-directory cpp/build \
              --gcov-executable "$GCOV" \
              --xml-pretty -o coverage.xml \
              --filter '^cpp/' \
              --exclude '^cpp/build/' \
              --exclude '^cpp/thirdparty/' \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
              --print-summary
          fi

          if [ ! -f coverage.xml ]; then
            printf '%s\n' \
              "<?xml version='1.0' encoding='UTF-8'?>" \
              "<!DOCTYPE coverage SYSTEM 'http://cobertura.sourceforge.net/xml/coverage-04.dtd'>" \
              "<coverage line-rate=\"0.0\" branch-rate=\"0.0\" lines-covered=\"0\" lines-valid=\"0\" branches-covered=\"0\" branches-valid=\"0\" complexity=\"0.0\" timestamp=\"0\" version=\"placeholder\">" \
              "  <sources><source>.</source></sources>" \
              "  <packages/>" \
              "</coverage>" \
              > coverage.xml
          fi

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage_cpp.py \
            --os macos \
            --compiler "${COMPILER_LABEL}" \
            --cxx-std ${{ matrix.cxx_std }} \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'os':'macos','compiler':os.getenv('COMPILER_LABEL','unknown'),'cxx_std':int('${{ matrix.cxx_std }}'),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          set +e
          key="macos-${COMPILER_KEY}-cxx${{ matrix.cxx_std }}"
          mkdir -p "_cov/cpp/${key}"
          cp -f cov.json "_cov/cpp/${key}/cov.json" 2>/dev/null || true
          cp -f coverage.xml "_cov/cpp/${key}/coverage.xml" 2>/dev/null || true

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-macos-${{ env.COMPILER_KEY }}-cxx${{ matrix.cxx_std }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn

      - name: install-cpp
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
        run: ./dev install-cpp

      - name: verify-install-cpp
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
        run: ./dev verify-install cpp

      - name: uninstall-cpp
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
        run: ./dev uninstall-cpp

      - name: verify-uninstall-cpp (expect failure)
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
          VERIFY_REQUIRE_INSTALL: "1"
        run: |
          set +e
          ./dev verify-install cpp
          status=$?
          if [ $status -eq 0 ]; then
            echo "verify-install succeeded after uninstall; expected failure"
            exit 1
          fi

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1

  windows:
    name: Windows / MSVC / C++${{ matrix.cxx_std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cxx_std: ["11", "14", "17", "20", "23"]
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}/devops
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CXX_STD: ${{ matrix.cxx_std }}
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        id: init_submodules
        continue-on-error: true
        run: python -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Setup C++
        id: setup_cpp
        continue-on-error: true
        run: python -m devtool.cli setup-cpp --config Debug

      - name: Build export C++ layer
        id: build_export
        continue-on-error: true
        run: python -m devtool.cli build-export-cpp --config Debug

      - name: Build C++
        id: build_cpp
        continue-on-error: true
        run: python -m devtool.cli build-cpp --config Debug

      - name: Coverage C++
        id: coverage_cpp
        continue-on-error: true
        run: python -m devtool.cli coverage-cpp

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          python tools/ci/extract_coverage_cpp.py `
            --os windows `
            --compiler msvc `
            --cxx-std ${{ matrix.cxx_std }} `
            --out cov.json

          if (-not (Test-Path cov.json)) {
            python -c "import json,os; obj={'os':'windows','compiler':'msvc','cxx_std':int(os.getenv('CXX_STD','0') or 0),'line_pct':0.0,'source':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'status':'placeholder'}; json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          }

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          $key = "windows-msvc-cxx${{ matrix.cxx_std }}"
          New-Item -ItemType Directory -Force -Path "_cov/cpp/$key" | Out-Null
          Copy-Item -Force cov.json "_cov/cpp/$key/cov.json" -ErrorAction SilentlyContinue

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpp-cov-windows-msvc-cxx${{ matrix.cxx_std }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn

      - name: install-cpp
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
          CMAKE_INSTALL_CONFIG_NAME: Debug
        run: python -m devtool.cli install-cpp

      - name: verify-install-cpp
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
        run: python -m devtool.cli verify-install cpp

      - name: uninstall-cpp
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
          CMAKE_INSTALL_CONFIG_NAME: Debug
        run: python -m devtool.cli uninstall-cpp

      - name: verify-uninstall-cpp (expect failure)
        id: verify_uninstall_cpp
        continue-on-error: true
        env:
          PREFIX: ${{ github.workspace }}/artifacts/cpp
          VERIFY_REQUIRE_INSTALL: "1"
        run: python -m devtool.cli verify-install cpp

      - name: assert-verify-uninstall-cpp failed
        if: ${{ steps.verify_uninstall_cpp.outcome != 'failure' }}
        run: |
          throw "verify-install succeeded after uninstall; expected failure"

      - name: Mark job failed if core steps failed
        if: ${{ steps.setup_cpp.outcome == 'failure' || steps.build_cpp.outcome == 'failure' || steps.coverage_cpp.outcome == 'failure' }}
        run: exit 1
