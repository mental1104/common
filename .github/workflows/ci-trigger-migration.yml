name: CI trigger migration

on:
  push:
    branches:
      - ci/pr-ready-for-review-only
    paths:
      - ".github/workflows/ci-trigger-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    name: Migrate workflow triggers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ci/pr-ready-for-review-only
          fetch-depth: 0

      - name: Restrict language workflows to ready_for_review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_paths = [
              Path(".github/workflows/python.yml"),
              Path(".github/workflows/cpp.yml"),
              Path(".github/workflows/golang.yml"),
              Path(".github/workflows/rust.yml"),
              Path(".github/workflows/dotnet.yml"),
              Path(".github/workflows/java.yml"),
          ]

          def is_top_level_event(line: str) -> bool:
              return (
                  line.startswith("  ")
                  and not line.startswith("    ")
                  and line.rstrip().endswith(":")
              )

          for path in workflow_paths:
              original = path.read_text(encoding="utf-8")
              lines = original.splitlines(keepends=True)
              updated: list[str] = []
              removed_push = False
              inserted_ready = False
              index = 0

              while index < len(lines):
                  line = lines[index]

                  if line.rstrip("\n") == "  push:":
                      removed_push = True
                      index += 1
                      while index < len(lines) and not is_top_level_event(lines[index]):
                          index += 1
                      continue

                  updated.append(line)
                  if line.rstrip("\n") == "  pull_request:":
                      updated.append("    types: [ready_for_review]\n")
                      inserted_ready = True
                  index += 1

              if not removed_push:
                  raise RuntimeError(f"{path}: expected one top-level push trigger")
              if not inserted_ready:
                  raise RuntimeError(f"{path}: expected one pull_request trigger")

              result = "".join(updated)
              if "  push:\n" in result:
                  raise RuntimeError(f"{path}: top-level push trigger still present")
              if result.count("    types: [ready_for_review]\n") != 1:
                  raise RuntimeError(f"{path}: ready_for_review trigger count is not one")

              path.write_text(result, encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ci-trigger-migration.yml
          git add \
            .github/workflows/python.yml \
            .github/workflows/cpp.yml \
            .github/workflows/golang.yml \
            .github/workflows/rust.yml \
            .github/workflows/dotnet.yml \
            .github/workflows/java.yml
          git diff --cached --check
          git commit -m "ci: 仅在 PR 转为 Ready for review 时运行 CI [skip ci]"
          git push origin HEAD:ci/pr-ready-for-review-only
