name: macOS Python & C++

on:
  push:
  pull_request:

jobs:
  python-macos:
    runs-on: macos-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        run: |
          python3 - <<'PY'
          import sys
          from devtool.commands.common import base_env
          from devtool.commands.ops import cpp as cpp_ops
          sys.exit(cpp_ops.git_submodules(base_env()) or 0)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Setup Python
        run: ./dev setup-python

      - name: Format Python
        run: ./dev fmt-python

      - name: Build Python
        run: ./dev build-python

      - name: Test Python
        run: ./dev test-python

      - name: Coverage Python
        run: ./dev coverage-python

      - name: Vet Python
        continue-on-error: true
        run: ./dev vet-python

      - name: Guard Python
        continue-on-error: true
        run: ./dev guard-python

  cpp-macos:
    runs-on: macos-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GCOV: "llvm-cov gcov"
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        run: |
          python3 - <<'PY'
          import sys
          from devtool.commands.common import base_env
          from devtool.commands.ops import cpp as cpp_ops
          sys.exit(cpp_ops.git_submodules(base_env()) or 0)
          PY

      - name: Install toolchain
        run: |
          brew update
          brew install cmake llvm ninja gcovr lcov mpfr gmp
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Setup C++
        run: ./dev setup-cpp --config Debug

      - name: Format C++
        run: ./dev fmt-cpp

      - name: Build C++
        run: ./dev build-cpp --config Debug

      - name: Test C++
        run: ./dev test-cpp

      - name: Coverage C++
        run: ./dev coverage-cpp

      - name: Vet C++
        continue-on-error: true
        run: ./dev vet-cpp

      - name: Guard C++
        continue-on-error: true
        run: ./dev guard-cpp
