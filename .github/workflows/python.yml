  windows:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson((vars.CI_ENABLE_PYTHON_314 == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.enable_python_314 == false || github.event.inputs.enable_python_314 == 'false'))) ? '{"include":[{"python":"3.8","python_spec":"3.8"},{"python":"3.9","python_spec":"3.9"},{"python":"3.10","python_spec":"3.10"},{"python":"3.11","python_spec":"3.11"},{"python":"3.12","python_spec":"3.12"},{"python":"3.13","python_spec":"3.13"}]}' : '{"include":[{"python":"3.8","python_spec":"3.8"},{"python":"3.9","python_spec":"3.9"},{"python":"3.10","python_spec":"3.10"},{"python":"3.11","python_spec":"3.11"},{"python":"3.12","python_spec":"3.12"},{"python":"3.13","python_spec":"3.13"},{"python":"3.14","python_spec":"3.14-dev","prerelease":true}]}' ) }}
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}/devops
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (sparse Boost)
        run: python -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_spec }}
          allow-prereleases: ${{ matrix.prerelease == true }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python }}-
            pip-${{ runner.os }}-

      - name: Setup Python
        run: python -m devtool.cli setup-python

      - name: Build Python
        run: python -m devtool.cli build-python

      - name: Coverage Python
        run: python -m devtool.cli coverage-python

      - name: Export coverage.xml (never fail)
        if: always()
        continue-on-error: true
        run: |
          if (Test-Path python) {
            Remove-Item -Force -ErrorAction SilentlyContinue python\coverage.xml
            Push-Location python
            python -m coverage xml -o coverage.xml
            Pop-Location
          }
          if (-not (Test-Path python\coverage.xml)) {
            @(
              "<?xml version='1.0' encoding='UTF-8'?>",
              "<coverage line-rate=""0.0"" branch-rate=""0.0"" lines-covered=""0"" lines-valid=""0"" branches-covered=""0"" branches-valid=""0"" complexity=""0.0"" timestamp=""0"" version=""placeholder"">",
              "  <sources><source>.</source></sources>",
              "  <packages/>",
              "</coverage>"
            ) | Out-File -Encoding utf8 python\coverage.xml
          }

      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          python tools/ci/extract_coverage_python.py `
            --os windows `
            --python "${{ matrix.python }}" `
            --xml python/coverage.xml `
            --out cov.json

          if (-not (Test-Path cov.json)) {
            python - <<'PY'
            import json,os
            obj={
              "lang":"python",
              "os":"windows",
              "python":os.getenv("PY_VER",""),
              "line_pct":0.0,
              "status":"placeholder",
              "sha":os.getenv("GITHUB_SHA",""),
              "run_id":os.getenv("GITHUB_RUN_ID",""),
              "source":"placeholder",
              "src":"python/coverage.xml",
            }
            json.dump(obj,open("cov.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
            PY
          }
        env:
          PY_VER: ${{ matrix.python }}

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          $key = "windows-py${{ matrix.python }}"
          New-Item -ItemType Directory -Force -Path "_cov/$key" | Out-Null
          Copy-Item -Force cov.json "_cov/$key/cov.json" -ErrorAction SilentlyContinue
          Copy-Item -Force python\coverage.xml "_cov/$key/coverage.xml" -ErrorAction SilentlyContinue

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: py-cov-windows-py${{ matrix.python }}
          path: _cov/windows-py${{ matrix.python }}
          retention-days: 7
          if-no-files-found: warn
