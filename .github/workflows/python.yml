  windows:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.8",  python_spec: "3.8",      prerelease: false }
          - { python: "3.9",  python_spec: "3.9",      prerelease: false }
          - { python: "3.10", python_spec: "3.10",     prerelease: false }
          - { python: "3.11", python_spec: "3.11",     prerelease: false }
          - { python: "3.12", python_spec: "3.12",     prerelease: false }
          - { python: "3.13", python_spec: "3.13",     prerelease: false }
          - { python: "3.14", python_spec: "3.14-dev", prerelease: true }

    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}/devops
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Gate prerelease (3.14) by input/vars
        id: gate
        run: |
          $enable = "true"
          if ("${{ matrix.prerelease }}" -eq "true") {
            if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              if ("${{ github.event.inputs.enable_python_314 }}" -eq "false") { $enable = "false" }
            } elseif ("${{ github.event_name }}" -eq "workflow_call") {
              if ("${{ inputs.enable_python_314 }}" -eq "false") { $enable = "false" }
            } else {
              if ("${{ vars.CI_ENABLE_PYTHON_314 }}" -eq "false") { $enable = "false" }
            }
          }
          "enable=$enable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stop early if prerelease disabled
        if: ${{ steps.gate.outputs.enable != 'true' }}
        run: |
          Write-Host "Python ${{ matrix.python }} is disabled by policy; skipping."
          exit 0

      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: python -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_spec }}
          allow-prereleases: ${{ matrix.prerelease }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Setup Python
        id: setup_env
        continue-on-error: true
        run: python -m devtool.cli setup-python

      - name: Build Python
        id: build_env
        continue-on-error: true
        run: python -m devtool.cli build-python

      - name: Coverage Python
        id: cov_env
        continue-on-error: true
        run: python -m devtool.cli coverage-python

      - name: Export coverage.xml + cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path python | Out-Null
          Push-Location python
          python -m coverage xml -o coverage.xml
          Pop-Location

          python tools/ci/extract_coverage_python.py `
            --os windows `
            --python "${{ matrix.python }}" `
            --xml python/coverage.xml `
            --out cov.json

          if (-not (Test-Path cov.json)) {
            python -c "import json,os;obj={'lang':'python','os':'windows','python':'${{ matrix.python }}','line_pct':0.0,'status':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'source':'coverage.xml','src':'python/coverage.xml'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          }

      - name: Stash coverage files (unique path)
        if: always()
        continue-on-error: true
        run: |
          $pykey = "${{ matrix.python }}".Replace(".","")
          $key = "windows-py$pykey"
          New-Item -ItemType Directory -Force -Path "_cov/python/$key" | Out-Null
          Copy-Item -Force cov.json "_cov/python/$key/cov.json" -ErrorAction SilentlyContinue
          Copy-Item -Force python/coverage.xml "_cov/python/$key/coverage.xml" -ErrorAction SilentlyContinue

      - name: Compute pykey
        if: always()
        id: pykey
        run: |
          $pykey = "${{ matrix.python }}".Replace(".","")
          "pykey=$pykey" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: py-cov-windows-py${{ steps.pykey.outputs.pykey }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn

      - name: install-python
        if: ${{ steps.gate.outputs.enable == 'true' }}
        run: python -m devtool.cli install-python

      - name: verify-install-python
        if: ${{ steps.gate.outputs.enable == 'true' }}
        run: python -m devtool.cli verify-install python

      - name: uninstall-python
        if: ${{ steps.gate.outputs.enable == 'true' }}
        run: python -m devtool.cli uninstall-python

      - name: verify-uninstall-python (expect failure)
        if: ${{ steps.gate.outputs.enable == 'true' }}
        id: verify_uninstall_python
        continue-on-error: true
        env:
          VERIFY_REQUIRE_INSTALL: "1"
        run: python -m devtool.cli verify-install python

      - name: assert-verify-uninstall-python failed
        if: ${{ steps.gate.outputs.enable == 'true' && steps.verify_uninstall_python.outcome != 'failure' }}
        run: |
          throw "verify-install succeeded after uninstall; expected failure"

      - name: Mark job failed if core steps failed
        if: ${{ steps.gate.outputs.enable == 'true' && (steps.setup_env.outcome == 'failure' || steps.build_env.outcome == 'failure' || steps.cov_env.outcome == 'failure') }}
        run: exit 1
