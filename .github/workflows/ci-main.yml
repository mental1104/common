name: CI Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cpp/**"
      - "python/**"
      - "golang/**"
      - "rust/**"
      - "dotnet/**"
      - "java/**"
      - "export/**"
      - "devops/**"
      - "tools/ci/**"
      - "tools/walkthrough/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "dev"
  push:
    branches: [main]
    paths:
      - "cpp/**"
      - "python/**"
      - "golang/**"
      - "rust/**"
      - "dotnet/**"
      - "java/**"
      - "export/**"
      - "devops/**"
      - "tools/ci/**"
      - "tools/walkthrough/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "dev"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-manual:
    name: Validate manual main ref
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::CI Gate manual runs can only target main."
            exit 1
          fi

  changes:
    name: Detect affected pipelines
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.routes.outputs.cpp }}
      python: ${{ steps.routes.outputs.python }}
      golang: ${{ steps.routes.outputs.golang }}
      rust: ${{ steps.routes.outputs.rust }}
      dotnet: ${{ steps.routes.outputs.dotnet }}
      java: ${{ steps.routes.outputs.java }}
      pages: ${{ steps.routes.outputs.pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected pipelines
        id: routes
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # PR 比较真实 base/head；main push 比较 before/head，避免临时 merge commit 干扰。
          if [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            changed_files="$(git show --pretty='' --name-only "${HEAD_SHA}")"
          else
            git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
            changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          printf '%s\n' "${changed_files}"

          route() {
            local name="$1"
            local pattern="$2"
            local matched="false"
            if grep -Eq "${pattern}" <<<"${changed_files}"; then
              matched="true"
            fi
            printf '%s=%s\n' "${name}" "${matched}" >> "${GITHUB_OUTPUT}"
          }

          # CI 路由或展示输入变化会验证全部语言；业务改动只验证对应语言。
          route cpp '^(cpp/|export/|devops/|tools/ci/|tools/walkthrough/|\.github/actions/|\.github/workflows/|dev$)'
          route python '^(python/|devops/|tools/ci/|tools/walkthrough/|\.github/workflows/|dev$)'
          route golang '^(golang/|devops/|tools/ci/|tools/walkthrough/|\.github/workflows/|dev$)'
          route rust '^(rust/|devops/|tools/ci/|tools/walkthrough/|\.github/workflows/|dev$)'
          route dotnet '^(dotnet/|devops/|tools/ci/|tools/walkthrough/|\.github/workflows/|dev$)'
          route java '^(java/|devops/|tools/ci/|tools/walkthrough/|\.github/workflows/|dev$)'
          route pages '^(tools/walkthrough/|\.github/workflows/)'

  cpp:
    needs: [validate-manual, changes]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || needs.validate-manual.result == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' && needs.changes.outputs.cpp == 'true'))
    uses: ./.github/workflows/cpp.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  python:
    needs: [validate-manual, changes]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || needs.validate-manual.result == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' && needs.changes.outputs.python == 'true'))
    uses: ./.github/workflows/python.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  golang:
    needs: [validate-manual, changes]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || needs.validate-manual.result == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' && needs.changes.outputs.golang == 'true'))
    uses: ./.github/workflows/golang.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  rust:
    needs: [validate-manual, changes]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || needs.validate-manual.result == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' && needs.changes.outputs.rust == 'true'))
    uses: ./.github/workflows/rust.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  dotnet:
    needs: [validate-manual, changes]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || needs.validate-manual.result == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' && needs.changes.outputs.dotnet == 'true'))
    uses: ./.github/workflows/dotnet.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  java:
    needs: [validate-manual, changes]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || needs.validate-manual.result == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' && needs.changes.outputs.java == 'true'))
    uses: ./.github/workflows/java.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  pages:
    needs: [changes, cpp, python, golang, rust, dotnet, java]
    if: >-
      always() && github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.pages == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/walkthrough-pages.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read

  notify-manual-failure:
    name: Notify manual failure
    needs: [validate-manual, cpp, python, golang, rust, dotnet, java]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v6
        with:
          connection_url: ${{ secrets.SMTP_CONNECTION_URL }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[CI Failed] ${{ github.repository }} main manual gate"
          body: |
            main 分支手动门禁执行失败。

            仓库：${{ github.repository }}
            提交：${{ github.sha }}
            执行人：${{ github.actor }}
            运行地址：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
