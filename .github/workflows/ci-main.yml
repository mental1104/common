name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cpp/**"
      - "python/**"
      - "golang/**"
      - "rust/**"
      - "dotnet/**"
      - "java/**"
      - "export/**"
      - "devops/**"
      - "tools/ci/**"
      - "tools/walkthrough/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "dev"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected pipelines
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.routes.outputs.cpp }}
      python: ${{ steps.routes.outputs.python }}
      golang: ${{ steps.routes.outputs.golang }}
      rust: ${{ steps.routes.outputs.rust }}
      dotnet: ${{ steps.routes.outputs.dotnet }}
      java: ${{ steps.routes.outputs.java }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected pipelines
        id: routes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # 显式比较 PR 的 base/head，避免 checkout 的临时 merge commit 干扰路径判断。
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          printf '%s\n' "${changed_files}"

          route() {
            local name="$1"
            local pattern="$2"
            local matched="false"
            if grep -Eq "${pattern}" <<<"${changed_files}"; then
              matched="true"
            fi
            printf '%s=%s\n' "${name}" "${matched}" >> "${GITHUB_OUTPUT}"
          }

          # 路由器、合入后门禁或展示输入变化会验证全部快速语言通道。
          route cpp '^(cpp/|export/|devops/|tools/ci/|tools/walkthrough/|\.github/actions/|\.github/workflows/|dev$)'
          route python '^(python/|devops/|tools/ci/|tools/walkthrough/|\.github/workflows/|dev$)'
          route golang '^(golang/|devops/|tools/ci/|tools/walkthrough/|\.github/workflows/|dev$)'
          route rust '^(rust/|devops/|tools/ci/|tools/walkthrough/|\.github/workflows/|dev$)'
          route dotnet '^(dotnet/|devops/|tools/ci/|tools/walkthrough/|\.github/workflows/|dev$)'
          route java '^(java/|devops/|tools/ci/|tools/walkthrough/|\.github/workflows/|dev$)'

  cpp:
    needs: changes
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       needs.changes.outputs.cpp == 'true')
    uses: ./.github/workflows/cpp.yml
    with:
      full_matrix: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  python:
    needs: changes
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       needs.changes.outputs.python == 'true')
    uses: ./.github/workflows/python.yml
    with:
      full_matrix: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  golang:
    needs: changes
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       needs.changes.outputs.golang == 'true')
    uses: ./.github/workflows/golang.yml
    with:
      full_matrix: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  rust:
    needs: changes
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       needs.changes.outputs.rust == 'true')
    uses: ./.github/workflows/rust.yml
    with:
      full_matrix: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  dotnet:
    needs: changes
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       needs.changes.outputs.dotnet == 'true')
    uses: ./.github/workflows/dotnet.yml
    with:
      full_matrix: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  java:
    needs: changes
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       needs.changes.outputs.java == 'true')
    uses: ./.github/workflows/java.yml
    with:
      full_matrix: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  notify-manual-failure:
    name: Notify manual failure
    needs: [cpp, python, golang, rust, dotnet, java]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v6
        with:
          connection_url: ${{ secrets.SMTP_CONNECTION_URL }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[CI Failed] ${{ github.repository }} main manual gate"
          body: |
            main 分支手动门禁执行失败。

            仓库：${{ github.repository }}
            提交：${{ github.sha }}
            执行人：${{ github.actor }}
            运行地址：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
