name: Main Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cpp/**"
      - "python/**"
      - "golang/**"
      - "rust/**"
      - "dotnet/**"
      - "java/**"
      - "export/**"
      - "devops/**"
      - "tools/ci/**"
      - "tools/walkthrough/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "dev"
  push:
    branches: [main]
    paths:
      - "cpp/**"
      - "python/**"
      - "golang/**"
      - "rust/**"
      - "dotnet/**"
      - "java/**"
      - "export/**"
      - "devops/**"
      - "tools/ci/**"
      - "tools/walkthrough/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "dev"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-target:
    name: Validate target ref
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require main target
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${GITHUB_BASE_REF}" != "main" ]]; then
              echo "::error::Pull request gate only supports the main target."
              exit 1
            fi
          elif [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Main Gate can only run against main."
            exit 1
          fi

  changes:
    name: Detect affected pipelines
    needs: validate-target
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.routes.outputs.cpp }}
      python: ${{ steps.routes.outputs.python }}
      golang: ${{ steps.routes.outputs.golang }}
      rust: ${{ steps.routes.outputs.rust }}
      dotnet: ${{ steps.routes.outputs.dotnet }}
      java: ${{ steps.routes.outputs.java }}
      pages: ${{ steps.routes.outputs.pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected pipelines
        id: routes
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # PR 使用真实 base/head，main push 使用 before/head，避免临时 merge commit 干扰路由。
          if [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            changed_files="$(git show --pretty='' --name-only "${HEAD_SHA}")"
          else
            git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
            changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          printf '%s\n' "${changed_files}"

          # 每个输出表示对应可复用 workflow 是否需要验证本次变更。
          emit_route() {
            local route="$1"
            shift

            local matched="false"
            local pattern
            for pattern in "$@"; do
              if grep -Eq "${pattern}" <<<"${changed_files}"; then
                matched="true"
                break
              fi
            done

            printf '%s=%s\n' "${route}" "${matched}" >> "${GITHUB_OUTPUT}"
          }

          emit_route cpp \
            '^cpp/' \
            '^export/' \
            '^devops/' \
            '^tools/ci/' \
            '^\.github/actions/cpp-coverage-artifact/' \
            '^\.github/workflows/cpp\.yml$' \
            '^\.github/workflows/ci-main\.yml$' \
            '^dev$'

          emit_route python \
            '^python/' \
            '^devops/' \
            '^tools/ci/' \
            '^\.github/workflows/python\.yml$' \
            '^\.github/workflows/ci-main\.yml$' \
            '^dev$'

          emit_route golang \
            '^golang/' \
            '^devops/' \
            '^tools/ci/' \
            '^\.github/workflows/golang\.yml$' \
            '^\.github/workflows/ci-main\.yml$' \
            '^dev$'

          emit_route rust \
            '^rust/' \
            '^devops/' \
            '^tools/ci/' \
            '^\.github/workflows/rust\.yml$' \
            '^\.github/workflows/ci-main\.yml$' \
            '^dev$'

          emit_route dotnet \
            '^dotnet/' \
            '^devops/' \
            '^tools/ci/' \
            '^\.github/workflows/dotnet\.yml$' \
            '^\.github/workflows/ci-main\.yml$' \
            '^dev$'

          emit_route java \
            '^java/' \
            '^devops/' \
            '^tools/ci/' \
            '^\.github/workflows/java\.yml$' \
            '^\.github/workflows/ci-main\.yml$' \
            '^dev$'

          emit_route pages \
            '^tools/walkthrough/' \
            '^\.github/workflows/walkthrough-pages\.yml$' \
            '^\.github/workflows/ci-main\.yml$'

  cpp:
    needs: [validate-target, changes]
    if: >-
      always() &&
      needs.validate-target.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' &&
        (needs.changes.outputs.cpp == 'true' || needs.changes.outputs.pages == 'true')))
    uses: ./.github/workflows/cpp.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  python:
    needs: [validate-target, changes]
    if: >-
      always() &&
      needs.validate-target.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' &&
        (needs.changes.outputs.python == 'true' || needs.changes.outputs.pages == 'true')))
    uses: ./.github/workflows/python.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  rust:
    needs: [validate-target, changes]
    if: >-
      always() &&
      needs.validate-target.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' &&
        (needs.changes.outputs.rust == 'true' || needs.changes.outputs.pages == 'true')))
    uses: ./.github/workflows/rust.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  dotnet:
    needs: [validate-target, changes]
    if: >-
      always() &&
      needs.validate-target.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' &&
        (needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.pages == 'true')))
    uses: ./.github/workflows/dotnet.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  golang:
    needs: [validate-target, changes]
    if: >-
      always() &&
      needs.validate-target.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' &&
        (needs.changes.outputs.golang == 'true' || needs.changes.outputs.pages == 'true')))
    uses: ./.github/workflows/golang.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  java:
    needs: [validate-target, changes]
    if: >-
      always() &&
      needs.validate-target.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' &&
        (needs.changes.outputs.java == 'true' || needs.changes.outputs.pages == 'true')))
    uses: ./.github/workflows/java.yml
    with:
      full_matrix: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  pages:
    needs: [validate-target, changes, cpp, python, rust, dotnet, golang, java]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.validate-target.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.pages == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/walkthrough-pages.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read

  notify-manual-failure:
    name: Notify manual failure
    needs: [validate-target, changes, cpp, python, rust, dotnet, golang, java]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v6
        with:
          connection_url: ${{ secrets.SMTP_CONNECTION_URL }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[CI Failed] ${{ github.repository }} main manual gate"
          body: |
            main 分支手动门禁执行失败。

            仓库：${{ github.repository }}
            提交：${{ github.sha }}
            执行人：${{ github.actor }}
            运行地址：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
