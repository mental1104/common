name: Pages

on:
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Python (builder)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dist/ (walkthrough)
        run: python tools/walkthrough/scan.py --out dist

      - name: Ensure _cov exists
        run: mkdir -p _cov

      - name: Download C++ coverage artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: _cov
          pattern: cpp-cov-*
          merge-multiple: true

      - name: Download Python coverage artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: _cov
          pattern: py-cov-*
          merge-multiple: true

      - name: Download Rust coverage artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: _cov
          pattern: rust-cov-*
          merge-multiple: true

      - name: Download .NET coverage artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: _cov
          pattern: dotnet-cov-*
          merge-multiple: true

      - name: Download Go coverage artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: _cov
          pattern: go-cov-*
          merge-multiple: true

      - name: Download Java coverage artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: _cov
          pattern: java-cov-*
          merge-multiple: true

      - name: Build coverage modules (dist/modules)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import statistics
          import html
          from pathlib import Path

          def is_placeholder(status: str) -> bool:
            st = (status or "").lower()
            return st in ("placeholder", "unknown", "fail", "failure", "error", "na", "n/a")

          def badge_color(pct: float, status: str) -> str:
            if is_placeholder(status):
              return "#9f9f9f"
            if pct >= 95:
              return "#4c1"
            if pct >= 85:
              return "#97CA00"
            if pct >= 70:
              return "#dfb317"
            if pct >= 50:
              return "#fe7d37"
            return "#e05d44"

          def est_w(text: str) -> int:
            return max(40, int(len(text) * 7 + 18))

          def svg_badge(label: str, msg: str, color: str) -> str:
            lw = est_w(label)
            mw = est_w(msg)
            w = lw + mw
            label_e = html.escape(label)
            msg_e = html.escape(msg)
            aria = html.escape(f"{label}: {msg}")
            return "\n".join([
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="20" role="img" aria-label="{aria}">',
              '  <linearGradient id="s" x2="0" y2="100%">',
              '    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>',
              '    <stop offset="1" stop-opacity=".1"/>',
              '  </linearGradient>',
              f'  <clipPath id="r"><rect width="{w}" height="20" rx="3" fill="#fff"/></clipPath>',
              '  <g clip-path="url(#r)">',
              f'    <rect width="{lw}" height="20" fill="#555"/>',
              f'    <rect x="{lw}" width="{mw}" height="20" fill="{color}"/>',
              f'    <rect width="{w}" height="20" fill="url(#s)"/>',
              '  </g>',
              '  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">',
              f'    <text x="{lw/2}" y="14">{label_e}</text>',
              f'    <text x="{lw + mw/2}" y="14">{msg_e}</text>',
              '  </g>',
              '</svg>',
            ])

          def pct_msg(pct: float, status: str) -> str:
            return "N/A" if is_placeholder(status) else f"{pct:.1f}%"

          def write_badge(path: Path, label: str, msg: str, status: str) -> None:
            path.parent.mkdir(parents=True, exist_ok=True)
            pct = 0.0
            if msg.endswith("%"):
              try:
                pct = float(msg[:-1])
              except Exception:
                pct = 0.0
            path.write_text(svg_badge(label, msg, badge_color(pct, status)), encoding="utf-8")

          def compiler_slug(comp: str) -> str:
            s = (comp or "unknown").lower()
            if "clang" in s:
              return "clangpp"
            if "g++" in s or "gcc" in s:
              return "gpp"
            if "msvc" in s:
              return "msvc"
            return "".join(ch for ch in s.replace("+", "p").replace(" ", "") if ch.isalnum() or ch in "-_")

          def build_cpp_module() -> None:
            module_root = Path("dist/modules/cpp-coverage")
            badges = module_root / "badges"
            data = module_root / "data"
            badges.mkdir(parents=True, exist_ok=True)
            data.mkdir(parents=True, exist_ok=True)

            raw = []
            cpp_root = Path("_cov/cpp")
            if cpp_root.exists():
              for p in cpp_root.rglob("cov.json"):
                key = p.parent.name
                try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                except Exception:
                  d = {}
                os_name = str(d.get("os", "unknown"))
                comp = str(d.get("compiler", "unknown"))
                try:
                  cxx = int(d.get("cxx_std", 0) or 0)
                except Exception:
                  cxx = 0
                try:
                  pct = float(d.get("line_pct", 0.0) or 0.0)
                except Exception:
                  pct = 0.0
                status = str(d.get("status", "ok"))
                raw.append({
                  "key": key,
                  "os": os_name,
                  "compiler": comp,
                  "compiler_slug": compiler_slug(comp),
                  "cxx_std": cxx,
                  "line_pct": pct,
                  "status": status,
                  "src": str(p),
                })

            expected = []
            for std in (11, 14, 17, 20, 23):
              expected.extend([
                ("linux", "clangpp", std),
                ("linux", "gpp", std),
                ("macos", "clangpp", std),
                ("macos", "gpp", std),
                ("windows", "msvc", std),
              ])

            def score(e):
              s = 0
              if not is_placeholder(e["status"]):
                s += 1000
              return s + e["line_pct"]

            matrix_entries = [e for e in raw if "integration" not in e["key"]]
            best = {}
            for e in matrix_entries:
              k = (e["os"], e["compiler_slug"], e["cxx_std"])
              if k not in best or score(e) > score(best[k]):
                best[k] = e
            for e in raw:
              if "integration" not in e["key"]:
                continue
              k = (e["os"], e["compiler_slug"], e["cxx_std"])
              if k not in best:
                best[k] = e

            selected = []
            for (osn, cs, std) in expected:
              e = best.get((osn, cs, std))
              if e:
                msg = pct_msg(e["line_pct"], e["status"])
                write_badge(badges / f"{osn}-{cs}-cxx{std}.svg", "cov", msg, e["status"])
                selected.append(e)
              else:
                write_badge(badges / f"{osn}-{cs}-cxx{std}.svg", "cov", "N/A", "na")

            integration = next((e for e in raw if e["key"] == "linux-gpp-cxx20-integration"), None)
            if integration:
              write_badge(
                badges / "linux-gpp-cxx20-integration.svg",
                "cov",
                pct_msg(integration["line_pct"], integration["status"]),
                integration["status"],
              )
            else:
              write_badge(badges / "linux-gpp-cxx20-integration.svg", "cov", "N/A", "na")

            real = [e["line_pct"] for e in selected if not is_placeholder(e["status"])]
            overall = statistics.mean(real) if real else 0.0
            overall_msg = "N/A" if not real else f"{overall:.1f}%"
            write_badge(badges / "overall.svg", "cov", overall_msg, "placeholder" if not real else "ok")

            data_entries = []
            for (osn, cs, std) in expected:
              e = best.get((osn, cs, std))
              if e:
                data_entries.append(e)
              else:
                data_entries.append({
                  "key": f"{osn}-{cs}-cxx{std}",
                  "os": osn,
                  "compiler": cs,
                  "compiler_slug": cs,
                  "cxx_std": std,
                  "line_pct": 0.0,
                  "status": "na",
                  "src": "",
                })

            (data / "coverage.json").write_text(
              json.dumps({"overall": overall if real else None, "entries": data_entries}, ensure_ascii=False, indent=2),
              encoding="utf-8",
            )

            os_list = ["linux", "macos", "windows"]
            stds = [11, 14, 17, 20, 23]
            comp_by_os = {"linux": ["clangpp", "gpp"], "macos": ["clangpp", "gpp"], "windows": ["msvc"]}

            def cell(osn, cs, st):
              fn = f"badges/{osn}-{cs}-cxx{st}.svg"
              return f'<img alt="{osn}-{cs}-cxx{st}" src="{fn}">'

            rows = []
            for osn in os_list:
              for cs in comp_by_os[osn]:
                tds = "".join(f"<td>{cell(osn, cs, st)}</td>" for st in stds)
                rows.append(f"<tr><th>{osn} / {cs}</th>{tds}</tr>")

            index = f"""<!doctype html>
            <meta charset=\"utf-8\">
            <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">
            <title>C++ Coverage</title>
            <h1>C++ Coverage</h1>
            <p><img alt=\"overall\" src=\"badges/overall.svg\"></p>

            <h2>Matrix</h2>
            <table border=\"1\" cellpadding=\"6\" cellspacing=\"0\">
              <thead>
                <tr><th>platform / compiler</th><th>C++11</th><th>C++14</th><th>C++17</th><th>C++20</th><th>C++23</th></tr>
              </thead>
              <tbody>
                {''.join(rows)}
              </tbody>
            </table>

            <h2>Integration</h2>
            <p><img alt=\"linux-gpp-cxx20-integration\" src=\"badges/linux-gpp-cxx20-integration.svg\"></p>

            <p>Data: <a href=\"data/coverage.json\">coverage.json</a></p>
            """
            module_root.mkdir(parents=True, exist_ok=True)
            (module_root / "index.html").write_text(index, encoding="utf-8")

          def build_python_module() -> None:
            module_root = Path("dist/modules/python-coverage")
            badges = module_root / "badges"
            data = module_root / "data"
            badges.mkdir(parents=True, exist_ok=True)
            data.mkdir(parents=True, exist_ok=True)

            def pykey(ver: str) -> str:
              return ver.replace(".", "")

            raw = []
            py_root = Path("_cov/python")
            if py_root.exists():
              for p in py_root.rglob("cov.json"):
                try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                except Exception:
                  d = {}
                os_name = str(d.get("os", "unknown"))
                ver = str(d.get("python", "unknown"))
                try:
                  pct = float(d.get("line_pct", 0.0) or 0.0)
                except Exception:
                  pct = 0.0
                status = str(d.get("status", "ok"))
                raw.append({
                  "os": os_name,
                  "python": ver,
                  "pyk": pykey(ver),
                  "line_pct": pct,
                  "status": status,
                  "src": str(p),
                })

            expected_py = ["38", "39", "310", "311", "312", "313", "314"]
            expected_os = ["linux", "macos", "windows"]

            def score(e):
              s = 0
              if not is_placeholder(e["status"]):
                s += 1000
              return s + e["line_pct"]

            best = {}
            for e in raw:
              k = (e["os"], e["pyk"])
              if k not in best or score(e) > score(best[k]):
                best[k] = e

            selected = []
            for osn in expected_os:
              for pyk in expected_py:
                e = best.get((osn, pyk))
                fn = f"python-{osn}-py{pyk}.svg"
                if e:
                  msg = pct_msg(e["line_pct"], e["status"])
                  write_badge(badges / fn, "cov", msg, e["status"])
                  selected.append(e)
                else:
                  write_badge(badges / fn, "cov", "N/A", "na")

            real = [e["line_pct"] for e in selected if not is_placeholder(e["status"])]
            overall = statistics.mean(real) if real else 0.0
            overall_msg = "N/A" if not real else f"{overall:.1f}%"
            write_badge(badges / "python-overall.svg", "cov", overall_msg, "placeholder" if not real else "ok")

            (data / "python-coverage.json").write_text(
              json.dumps({"overall": overall if real else None, "entries": raw}, ensure_ascii=False, indent=2),
              encoding="utf-8",
            )

            cols = expected_py
            def cell(osn, pyk):
              return f'<img alt="{osn}-py{pyk}" src="badges/python-{osn}-py{pyk}.svg">'
            rows = []
            for osn in expected_os:
              tds = "".join(f"<td>{cell(osn,pyk)}</td>" for pyk in cols)
              rows.append(f"<tr><th>{osn}</th>{tds}</tr>")

            header = "".join(f"<th>py{c}</th>" for c in cols)
            (module_root / "index.html").write_text(
              f"""<!doctype html>
            <meta charset=\"utf-8\">
            <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">
            <title>Python Coverage</title>
            <h1>Python Coverage</h1>
            <p><img alt=\"python-overall\" src=\"badges/python-overall.svg\"></p>
            <table border=\"1\" cellpadding=\"6\" cellspacing=\"0\">
              <thead><tr><th>os</th>{header}</tr></thead>
              <tbody>{''.join(rows)}</tbody>
            </table>
            <p>Data: <a href=\"data/python-coverage.json\">python-coverage.json</a></p>
            """,
              encoding="utf-8",
            )

          def sanitize_version(ver: str) -> str:
            return "".join(ch for ch in (ver or "unknown").lower() if ch.isalnum())

          def build_rust_module() -> None:
            module_root = Path("dist/modules/rust-coverage")
            badges = module_root / "badges"
            data = module_root / "data"
            badges.mkdir(parents=True, exist_ok=True)
            data.mkdir(parents=True, exist_ok=True)

            raw = []
            rust_root = Path("_cov/rust")
            if rust_root.exists():
              for p in rust_root.rglob("cov.json"):
                try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                except Exception:
                  d = {}
                os_name = str(d.get("os", "unknown"))
                ver = str(d.get("toolchain", "unknown"))
                ver_key = sanitize_version(ver)
                try:
                  pct = float(d.get("line_pct", 0.0) or 0.0)
                except Exception:
                  pct = 0.0
                status = str(d.get("status", "ok"))
                raw.append({
                  "os": os_name,
                  "toolchain": ver,
                  "ver_key": ver_key,
                  "line_pct": pct,
                  "status": status,
                  "src": str(p),
                })

            expected_versions = ["stable", "1.85.0"]
            expected_os = ["linux", "macos", "windows"]

            def score(e):
              s = 0
              if not is_placeholder(e["status"]):
                s += 1000
              return s + e["line_pct"]

            best = {}
            for e in raw:
              k = (e["os"], e["ver_key"])
              if k not in best or score(e) > score(best[k]):
                best[k] = e

            selected = []
            for osn in expected_os:
              for ver in expected_versions:
                ver_key = sanitize_version(ver)
                e = best.get((osn, ver_key))
                fn = f"rust-{osn}-{ver_key}.svg"
                if e:
                  msg = pct_msg(e["line_pct"], e["status"])
                  write_badge(badges / fn, "cov", msg, e["status"])
                  selected.append(e)
                else:
                  write_badge(badges / fn, "cov", "N/A", "na")

            real = [e["line_pct"] for e in selected if not is_placeholder(e["status"])]
            overall = statistics.mean(real) if real else 0.0
            overall_msg = "N/A" if not real else f"{overall:.1f}%"
            write_badge(badges / "rust-overall.svg", "cov", overall_msg, "placeholder" if not real else "ok")

            (data / "rust-coverage.json").write_text(
              json.dumps({"overall": overall if real else None, "entries": raw}, ensure_ascii=False, indent=2),
              encoding="utf-8",
            )

            cols = expected_versions
            def cell(osn, ver):
              ver_key = sanitize_version(ver)
              return f'<img alt="{osn}-rust-{ver}" src="badges/rust-{osn}-{ver_key}.svg">'
            rows = []
            for osn in expected_os:
              tds = "".join(f"<td>{cell(osn,ver)}</td>" for ver in cols)
              rows.append(f"<tr><th>{osn}</th>{tds}</tr>")

            header = "".join(f"<th>{v}</th>" for v in cols)
            (module_root / "index.html").write_text(
              f"""<!doctype html>
            <meta charset=\"utf-8\">
            <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">
            <title>Rust Coverage</title>
            <h1>Rust Coverage</h1>
            <p><img alt=\"rust-overall\" src=\"badges/rust-overall.svg\"></p>
            <table border=\"1\" cellpadding=\"6\" cellspacing=\"0\">
              <thead><tr><th>os</th>{header}</tr></thead>
              <tbody>{''.join(rows)}</tbody>
            </table>
            <p>Data: <a href=\"data/rust-coverage.json\">rust-coverage.json</a></p>
            """,
              encoding="utf-8",
            )

          def build_dotnet_module() -> None:
            module_root = Path("dist/modules/dotnet-coverage")
            badges = module_root / "badges"
            data = module_root / "data"
            badges.mkdir(parents=True, exist_ok=True)
            data.mkdir(parents=True, exist_ok=True)

            raw = []
            dotnet_root = Path("_cov/dotnet")
            if dotnet_root.exists():
              for p in dotnet_root.rglob("cov.json"):
                try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                except Exception:
                  d = {}
                os_name = str(d.get("os", "unknown"))
                ver = str(d.get("dotnet", "unknown"))
                ver_key = sanitize_version(ver)
                try:
                  pct = float(d.get("line_pct", 0.0) or 0.0)
                except Exception:
                  pct = 0.0
                status = str(d.get("status", "ok"))
                raw.append({
                  "os": os_name,
                  "dotnet": ver,
                  "ver_key": ver_key,
                  "line_pct": pct,
                  "status": status,
                  "src": str(p),
                })

            expected_versions = ["8.0.x"]
            expected_os = ["linux", "macos", "windows"]

            def score(e):
              s = 0
              if not is_placeholder(e["status"]):
                s += 1000
              return s + e["line_pct"]

            best = {}
            for e in raw:
              k = (e["os"], e["ver_key"])
              if k not in best or score(e) > score(best[k]):
                best[k] = e

            selected = []
            for osn in expected_os:
              for ver in expected_versions:
                ver_key = sanitize_version(ver)
                e = best.get((osn, ver_key))
                fn = f"dotnet-{osn}-dotnet{ver_key}.svg"
                if e:
                  msg = pct_msg(e["line_pct"], e["status"])
                  write_badge(badges / fn, "cov", msg, e["status"])
                  selected.append(e)
                else:
                  write_badge(badges / fn, "cov", "N/A", "na")

            real = [e["line_pct"] for e in selected if not is_placeholder(e["status"])]
            overall = statistics.mean(real) if real else 0.0
            overall_msg = "N/A" if not real else f"{overall:.1f}%"
            write_badge(badges / "dotnet-overall.svg", "cov", overall_msg, "placeholder" if not real else "ok")

            (data / "dotnet-coverage.json").write_text(
              json.dumps({"overall": overall if real else None, "entries": raw}, ensure_ascii=False, indent=2),
              encoding="utf-8",
            )

            cols = expected_versions
            def cell(osn, ver):
              ver_key = sanitize_version(ver)
              return f'<img alt="{osn}-dotnet-{ver}" src="badges/dotnet-{osn}-dotnet{ver_key}.svg">'
            rows = []
            for osn in expected_os:
              tds = "".join(f"<td>{cell(osn,ver)}</td>" for ver in cols)
              rows.append(f"<tr><th>{osn}</th>{tds}</tr>")

            header = "".join(f"<th>.NET {v}</th>" for v in cols)
            (module_root / "index.html").write_text(
              f"""<!doctype html>
            <meta charset=\"utf-8\">
            <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">
            <title>.NET Coverage</title>
            <h1>.NET Coverage</h1>
            <p><img alt=\"dotnet-overall\" src=\"badges/dotnet-overall.svg\"></p>
            <table border=\"1\" cellpadding=\"6\" cellspacing=\"0\">
              <thead><tr><th>os</th>{header}</tr></thead>
              <tbody>{''.join(rows)}</tbody>
            </table>
            <p>Data: <a href=\"data/dotnet-coverage.json\">dotnet-coverage.json</a></p>
            """,
              encoding="utf-8",
            )

          def build_golang_module() -> None:
            module_root = Path("dist/modules/golang-coverage")
            badges = module_root / "badges"
            data = module_root / "data"
            badges.mkdir(parents=True, exist_ok=True)
            data.mkdir(parents=True, exist_ok=True)

            raw = []
            go_root = Path("_cov/golang")
            if go_root.exists():
              for p in go_root.rglob("cov.json"):
                try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                except Exception:
                  d = {}
                os_name = str(d.get("os", "unknown"))
                ver = str(d.get("go", "unknown"))
                ver_key = sanitize_version(ver)
                try:
                  pct = float(d.get("line_pct", 0.0) or 0.0)
                except Exception:
                  pct = 0.0
                status = str(d.get("status", "ok"))
                raw.append({
                  "os": os_name,
                  "go": ver,
                  "ver_key": ver_key,
                  "line_pct": pct,
                  "status": status,
                  "src": str(p),
                })

            expected_versions = ["1.22.x", "1.23.x", "1.24.x", "1.25.x"]
            expected_os = ["linux", "macos", "windows"]

            def score(e):
              s = 0
              if not is_placeholder(e["status"]):
                s += 1000
              return s + e["line_pct"]

            best = {}
            for e in raw:
              k = (e["os"], e["ver_key"])
              if k not in best or score(e) > score(best[k]):
                best[k] = e

            selected = []
            for osn in expected_os:
              for ver in expected_versions:
                ver_key = sanitize_version(ver)
                e = best.get((osn, ver_key))
                fn = f"golang-{osn}-go{ver_key}.svg"
                if e:
                  msg = pct_msg(e["line_pct"], e["status"])
                  write_badge(badges / fn, "cov", msg, e["status"])
                  selected.append(e)
                else:
                  write_badge(badges / fn, "cov", "N/A", "na")

            real = [e["line_pct"] for e in selected if not is_placeholder(e["status"])]
            overall = statistics.mean(real) if real else 0.0
            overall_msg = "N/A" if not real else f"{overall:.1f}%"
            write_badge(badges / "golang-overall.svg", "cov", overall_msg, "placeholder" if not real else "ok")

            (data / "golang-coverage.json").write_text(
              json.dumps({"overall": overall if real else None, "entries": raw}, ensure_ascii=False, indent=2),
              encoding="utf-8",
            )

            cols = expected_versions
            def cell(osn, ver):
              ver_key = sanitize_version(ver)
              return f'<img alt="{osn}-go{ver}" src="badges/golang-{osn}-go{ver_key}.svg">'
            rows = []
            for osn in expected_os:
              tds = "".join(f"<td>{cell(osn,ver)}</td>" for ver in cols)
              rows.append(f"<tr><th>{osn}</th>{tds}</tr>")

            header = "".join(f"<th>go{v}</th>" for v in cols)
            (module_root / "index.html").write_text(
              f"""<!doctype html>
            <meta charset=\"utf-8\">
            <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">
            <title>Go Coverage</title>
            <h1>Go Coverage</h1>
            <p><img alt=\"golang-overall\" src=\"badges/golang-overall.svg\"></p>
            <table border=\"1\" cellpadding=\"6\" cellspacing=\"0\">
              <thead><tr><th>os</th>{header}</tr></thead>
              <tbody>{''.join(rows)}</tbody>
            </table>
            <p>Data: <a href=\"data/golang-coverage.json\">golang-coverage.json</a></p>
            """,
              encoding="utf-8",
            )

          def build_java_module() -> None:
            module_root = Path("dist/modules/java-coverage")
            badges = module_root / "badges"
            data = module_root / "data"
            badges.mkdir(parents=True, exist_ok=True)
            data.mkdir(parents=True, exist_ok=True)

            raw = []
            java_root = Path("_cov/java")
            if java_root.exists():
              for p in java_root.rglob("cov.json"):
                try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                except Exception:
                  d = {}
                os_name = str(d.get("os", "unknown"))
                ver = str(d.get("java", "unknown"))
                ver_key = sanitize_version(ver)
                try:
                  pct = float(d.get("line_pct", 0.0) or 0.0)
                except Exception:
                  pct = 0.0
                status = str(d.get("status", "ok"))
                raw.append({
                  "os": os_name,
                  "java": ver,
                  "ver_key": ver_key,
                  "line_pct": pct,
                  "status": status,
                  "src": str(p),
                })

            expected_versions = ["11", "17", "21"]
            expected_os = ["linux", "macos", "windows"]

            def score(e):
              s = 0
              if not is_placeholder(e["status"]):
                s += 1000
              return s + e["line_pct"]

            best = {}
            for e in raw:
              k = (e["os"], e["ver_key"])
              if k not in best or score(e) > score(best[k]):
                best[k] = e

            selected = []
            for osn in expected_os:
              for ver in expected_versions:
                ver_key = sanitize_version(ver)
                e = best.get((osn, ver_key))
                fn = f"java-{osn}-jdk{ver_key}.svg"
                if e:
                  msg = pct_msg(e["line_pct"], e["status"])
                  write_badge(badges / fn, "cov", msg, e["status"])
                  selected.append(e)
                else:
                  write_badge(badges / fn, "cov", "N/A", "na")

            real = [e["line_pct"] for e in selected if not is_placeholder(e["status"])]
            overall = statistics.mean(real) if real else 0.0
            overall_msg = "N/A" if not real else f"{overall:.1f}%"
            write_badge(badges / "java-overall.svg", "cov", overall_msg, "placeholder" if not real else "ok")

            (data / "java-coverage.json").write_text(
              json.dumps({"overall": overall if real else None, "entries": raw}, ensure_ascii=False, indent=2),
              encoding="utf-8",
            )

            cols = expected_versions
            def cell(osn, ver):
              ver_key = sanitize_version(ver)
              return f'<img alt="{osn}-jdk{ver}" src="badges/java-{osn}-jdk{ver_key}.svg">'
            rows = []
            for osn in expected_os:
              tds = "".join(f"<td>{cell(osn,ver)}</td>" for ver in cols)
              rows.append(f"<tr><th>{osn}</th>{tds}</tr>")

            header = "".join(f"<th>JDK {v}</th>" for v in cols)
            (module_root / "index.html").write_text(
              f"""<!doctype html>
            <meta charset=\"utf-8\">
            <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">
            <title>Java Coverage</title>
            <h1>Java Coverage</h1>
            <p><img alt=\"java-overall\" src=\"badges/java-overall.svg\"></p>
            <table border=\"1\" cellpadding=\"6\" cellspacing=\"0\">
              <thead><tr><th>os</th>{header}</tr></thead>
              <tbody>{''.join(rows)}</tbody>
            </table>
            <p>Data: <a href=\"data/java-coverage.json\">java-coverage.json</a></p>
            """,
              encoding="utf-8",
            )

          build_cpp_module()
          build_python_module()
          build_rust_module()
          build_dotnet_module()
          build_golang_module()
          build_java_module()

          Path("dist/.nojekyll").write_text("", encoding="utf-8")
          PY

      - name: Inject/Update coverage sections into walkthrough home
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          home = Path("dist/index.html")
          if not home.exists():
            raise SystemExit(0)

          html = home.read_text(encoding="utf-8", errors="ignore")

          blocks = [
            (
              "CPP",
              "modules/cpp-coverage/",
              "modules/cpp-coverage/badges/overall.svg",
              "C++ Coverage",
            ),
            (
              "PYTHON",
              "modules/python-coverage/",
              "modules/python-coverage/badges/python-overall.svg",
              "Python Coverage",
            ),
            (
              "RUST",
              "modules/rust-coverage/",
              "modules/rust-coverage/badges/rust-overall.svg",
              "Rust Coverage",
            ),
            (
              "DOTNET",
              "modules/dotnet-coverage/",
              "modules/dotnet-coverage/badges/dotnet-overall.svg",
              ".NET Coverage",
            ),
            (
              "GOLANG",
              "modules/golang-coverage/",
              "modules/golang-coverage/badges/golang-overall.svg",
              "Go Coverage",
            ),
            (
              "JAVA",
              "modules/java-coverage/",
              "modules/java-coverage/badges/java-overall.svg",
              "Java Coverage",
            ),
          ]

          def upsert(s: str, tag: str, block: str) -> str:
            begin = f"<!-- MODULE:{tag}_COVERAGE_BEGIN -->"
            end = f"<!-- MODULE:{tag}_COVERAGE_END -->"
            pattern = re.compile(re.escape(begin) + r"(.|\n)*?" + re.escape(end), re.M)
            if pattern.search(s):
              return pattern.sub(block, s, count=1)
            if "</body>" in s:
              return s.replace("</body>", block + "\n</body>", 1)
            return s + "\n" + block + "\n"

          for tag, href, badge, title in blocks:
            block = f"""
          <hr>
          <!-- MODULE:{tag}_COVERAGE_BEGIN -->
          <h2>{title}</h2>
          <p>
            <a href=\"{href}\">
              <img alt=\"{tag.lower()}-overall\" src=\"{badge}\">
            </a>
          </p>
          <p><a href=\"{href}\">Open {title} Dashboard</a></p>
          <!-- MODULE:{tag}_COVERAGE_END -->
            """.strip()
            html = upsert(html, tag, block)

          home.write_text(html, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment_retry_1.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry_2
        if: steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
