name: Walkthrough Pages (develop)

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # 1) 原 walkthrough：生成 dist/（保持原用途：语言标记统计）
      - name: Generate dist/ (walkthrough)
        run: python tools/walkthrough/scan.py --out dist

      - name: Job Summary (walkthrough)
        run: |
          if [ -f dist/summary.md ]; then
            cat dist/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # 2) 找到同一 commit 的 C++ workflow run_id（用于下载 coverage artifacts）
      - name: Find C++ workflow run for this commit
        id: find_cpp_run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          json="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/runs?event=push&status=completed&per_page=50")"

          run_id="$(echo "$json" | jq -r --arg sha "$SHA" '
            .workflow_runs
            | map(select(.head_sha == $sha))
            | map(select(.name == "C++"))
            | (.[0].id // empty)
          ')"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "Found C++ run_id=$run_id for sha=$SHA"
          else
            echo "No C++ run found for sha=$SHA (yet). Coverage module will be N/A."
          fi

      # 3) 下载 cpp.yml 上传的 coverage artifacts 到 _cov/（不会影响 dist）
      - name: Download C++ coverage artifacts
        if: ${{ steps.find_cpp_run.outputs.run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          path: _cov
          pattern: cpp-cov-*
          merge-multiple: false
          run-id: ${{ steps.find_cpp_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Ensure _cov exists
        if: always()
        run: mkdir -p _cov

      # 4) 构建 coverage 模块到 dist/modules/cpp-coverage/（不覆盖 walkthrough 根页面）
      - name: Build C++ coverage module (dist/modules/cpp-coverage)
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, statistics, html
          from pathlib import Path

          module_root = Path("dist/modules/cpp-coverage")
          badges = module_root / "badges"
          data = module_root / "data"
          module_root.mkdir(parents=True, exist_ok=True)
          badges.mkdir(parents=True, exist_ok=True)
          data.mkdir(parents=True, exist_ok=True)

          def badge_color(pct: float, status: str) -> str:
            st = (status or "").lower()
            if st in ("placeholder","unknown","fail","failure","error","na","n/a"):
              return "#9f9f9f"
            if pct >= 95: return "#4c1"
            if pct >= 85: return "#97CA00"
            if pct >= 70: return "#dfb317"
            if pct >= 50: return "#fe7d37"
            return "#e05d44"

          def est_w(text: str) -> int:
            return max(40, int(len(text) * 7 + 18))

          def svg_badge(label: str, msg: str, color: str) -> str:
            lw = est_w(label); mw = est_w(msg); w = lw + mw
            label_e = html.escape(label); msg_e = html.escape(msg)
            aria = html.escape(f"{label}: {msg}")
            return "\n".join([
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="20" role="img" aria-label="{aria}">',
              '  <linearGradient id="s" x2="0" y2="100%">',
              '    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>',
              '    <stop offset="1" stop-opacity=".1"/>',
              '  </linearGradient>',
              f'  <clipPath id="r"><rect width="{w}" height="20" rx="3" fill="#fff"/></clipPath>',
              '  <g clip-path="url(#r)">',
              f'    <rect width="{lw}" height="20" fill="#555"/>',
              f'    <rect x="{lw}" width="{mw}" height="20" fill="{color}"/>',
              f'    <rect width="{w}" height="20" fill="url(#s)"/>',
              '  </g>',
              '  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">',
              f'    <text x="{lw/2}" y="14">{label_e}</text>',
              f'    <text x="{lw + mw/2}" y="14">{msg_e}</text>',
              '  </g>',
              '</svg>',
            ])

          # cov.json: _cov/**/cov.json
          cov_files = [Path(p) for p in glob.glob("_cov/**/cov.json", recursive=True)]

          raw = []
          for p in cov_files:
            artifact_dir = p.parent.name
            key = artifact_dir[len("cpp-cov-"):] if artifact_dir.startswith("cpp-cov-") else artifact_dir
            try:
              d = json.loads(p.read_text(encoding="utf-8"))
            except Exception:
              d = {}
            os_name = str(d.get("os", "unknown"))
            comp = str(d.get("compiler", "unknown")).lower()
            cxx = int(d.get("cxx_std", 0) or 0)
            pct = float(d.get("line_pct", 0.0) or 0.0)
            status = str(d.get("status", "ok"))
            if "clang" in comp: cs = "clangpp"
            elif "g++" in comp or "gcc" in comp: cs = "gpp"
            elif "msvc" in comp: cs = "msvc"
            else: cs = "unknown"
            raw.append({"key": key, "os": os_name, "cs": cs, "cxx": cxx, "pct": pct, "status": status, "src": str(p)})

          # 全量矩阵（缺的也生成 N/A）
          expected = []
          for std in (11,14,17,20,23):
            expected += [
              ("linux","clangpp",std), ("linux","gpp",std),
              ("macos","clangpp",std), ("macos","gpp",std),
              ("windows","msvc",std),
            ]

          # 选最佳（排除 integration，避免污染矩阵）
          def score(e):
            st = (e["status"] or "").lower()
            s = 0
            if st not in ("placeholder","unknown","fail","failure","error"):
              s += 1000
            return s + e["pct"]

          best = {}
          for e in raw:
            if "integration" in e["key"]:
              continue
            k = (e["os"], e["cs"], e["cxx"])
            if k not in best or score(e) > score(best[k]):
              best[k] = e

          selected = []
          for (osn, cs, std) in expected:
            e = best.get((osn, cs, std))
            if e:
              msg = f'{e["pct"]:.1f}%'
              (badges / f"{osn}-{cs}-cxx{std}.svg").write_text(svg_badge("cov", msg, badge_color(e["pct"], e["status"])), encoding="utf-8")
              selected.append(e)
            else:
              (badges / f"{osn}-{cs}-cxx{std}.svg").write_text(svg_badge("cov", "N/A", badge_color(0.0, "na")), encoding="utf-8")

          # integration 单独一张（按你现有 key）
          integ = next((e for e in raw if e["key"] == "linux-gpp-cxx20-integration"), None)
          if integ:
            (badges / "linux-gpp-cxx20-integration.svg").write_text(
              svg_badge("cov", f'{integ["pct"]:.1f}%', badge_color(integ["pct"], integ["status"])),
              encoding="utf-8",
            )
          else:
            (badges / "linux-gpp-cxx20-integration.svg").write_text(
              svg_badge("cov", "N/A", badge_color(0.0, "na")),
              encoding="utf-8",
            )

          # overall
          real = [e["pct"] for e in selected if (e["status"] or "").lower() not in ("placeholder","unknown","fail","failure","error")]
          overall = statistics.mean(real) if real else 0.0
          (badges / "overall.svg").write_text(
            svg_badge("cov", f"{overall:.1f}%", badge_color(overall, "ok" if real else "placeholder")),
            encoding="utf-8",
          )

          # data
          out_entries = []
          for (osn, cs, std) in expected:
            e = best.get((osn, cs, std))
            out_entries.append({
              "os": osn, "compiler": cs, "cxx_std": std,
              "line_pct": (e["pct"] if e else 0.0),
              "status": (e["status"] if e else "na"),
              "src": (e["src"] if e else ""),
            })
          (data / "coverage.json").write_text(
            json.dumps({"overall": overall, "entries": out_entries}, ensure_ascii=False, indent=2),
            encoding="utf-8",
          )

          # 模块首页（不占用 dist/index.html）
          os_list = ["linux","macos","windows"]
          stds = [11,14,17,20,23]
          comp_by_os = {"linux":["clangpp","gpp"], "macos":["clangpp","gpp"], "windows":["msvc"]}

          def cell(osn, cs, st):
            fn = f"badges/{osn}-{cs}-cxx{st}.svg"
            return f'<img alt="{osn}-{cs}-cxx{st}" src="{fn}">'

          rows = []
          for osn in os_list:
            for cs in comp_by_os[osn]:
              tds = "".join(f"<td>{cell(osn,cs,st)}</td>" for st in stds)
              rows.append(f"<tr><th>{osn} / {cs}</th>{tds}</tr>")

          index = f"""<!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>C++ Coverage</title>
          <h1>C++ Coverage</h1>
          <p><img alt="overall" src="badges/overall.svg"></p>
          <table border="1" cellpadding="6" cellspacing="0">
            <thead><tr><th>platform / compiler</th><th>C++11</th><th>C++14</th><th>C++17</th><th>C++20</th><th>C++23</th></tr></thead>
            <tbody>{''.join(rows)}</tbody>
          </table>
          <h2>Integration</h2>
          <p><img alt="linux-gpp-cxx20-integration" src="badges/linux-gpp-cxx20-integration.svg"></p>
          <p>Data: <a href="data/coverage.json">coverage.json</a></p>
          """
          (module_root / "index.html").write_text(index, encoding="utf-8")

          print(f"[coverage-module] cov.json found={len(cov_files)} overall={overall:.2f}%")
          PY

      # 5) “嵌入”到 walkthrough 首页：只追加一段区块，不破坏原页面
      - name: Inject C++ coverage section into walkthrough home
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path("dist/index.html")
          if not home.exists():
            print("[inject] dist/index.html not found; skip")
            raise SystemExit(0)

          html = home.read_text(encoding="utf-8", errors="ignore")
          marker = "<!-- MODULE:CPP_COVERAGE -->"
          if marker in html:
            print("[inject] already injected; skip")
            raise SystemExit(0)

          snippet = """
          <hr>
          <!-- MODULE:CPP_COVERAGE -->
          <h2>C++ Coverage</h2>
          <p>
            <a href="modules/cpp-coverage/">
              <img alt="overall" src="modules/cpp-coverage/badges/overall.svg">
            </a>
          </p>
          <p><a href="modules/cpp-coverage/">Open C++ Coverage Dashboard</a></p>
          """

          # 尽量“插到结尾前”，否则直接追加
          if "</body>" in html:
            html = html.replace("</body>", snippet + "\n</body>", 1)
          else:
            html = html + "\n" + snippet + "\n"

          home.write_text(html, encoding="utf-8")
          print("[inject] injected coverage section into dist/index.html")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
