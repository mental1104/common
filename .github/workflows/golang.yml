name: Go

on:
  workflow_call:
    inputs:
      enable_go_prerelease:
        description: "Run Go 1.24/1.25 jobs (pre-release)"
        type: boolean
        default: true
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true
  push:
    branches-ignore:
      - main
    paths:
      - "golang/**"
      - "devops/**"
      - ".github/workflows/golang.yml"
  pull_request:
    paths:
      - "golang/**"
      - "devops/**"
      - ".github/workflows/golang.yml"
  workflow_dispatch:
    inputs:
      enable_go_prerelease:
        description: "Run Go 1.24/1.25 jobs (pre-release)"
        type: boolean
        default: true
      verbose_logs:
        description: "Enable verbose test output"
        type: boolean
        default: true

env:
  GO_TEST_V: ${{ (vars.CI_VERBOSE_LOGS == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verbose_logs == false || github.event.inputs.verbose_logs == 'false')) || (github.event_name == 'workflow_call' && (inputs.verbose_logs == false || inputs.verbose_logs == 'false'))) && '' || '-v' }}

jobs:
  linux:
    name: Linux / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(( (github.event_name == 'workflow_dispatch' && (github.event.inputs.enable_go_prerelease == false || github.event.inputs.enable_go_prerelease == 'false')) || (github.event_name == 'workflow_call' && (inputs.enable_go_prerelease == false || inputs.enable_go_prerelease == 'false')) || vars.CI_ENABLE_GO_PRERELEASE == 'false') && '{"go":["1.22.x","1.23.x"]}' || '{"go":["1.22.x","1.23.x","1.24.x","1.25.x"]}') }}
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/devops
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import sys
          from devtool.commands.common import base_env
          from devtool.commands.ops import cpp as cpp_ops
          sys.exit(cpp_ops.git_submodules(base_env()) or 0)
          PY
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Setup Go deps
        continue-on-error: true
        run: ./dev setup-go
      - name: Format Go
        if: ${{ matrix.go == '1.22.x' }}
        continue-on-error: true
        run: ./dev fmt-go
      - name: Build Go
        continue-on-error: true
        run: ./dev build-go
      - name: Coverage Go
        env:
          GOFLAGS: ${{ (vars.CI_VERBOSE_LOGS == 'false' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verbose_logs == false || github.event.inputs.verbose_logs == 'false')) || (github.event_name == 'workflow_call' && (inputs.verbose_logs == false || inputs.verbose_logs == 'false'))) && '' || '-v' }}
        continue-on-error: true
        run: ./dev coverage-go
      - name: Vet Go
        if: ${{ matrix.go == '1.22.x' }}
        continue-on-error: true
        run: ./dev vet-go
      - name: Guard Go
        if: ${{ matrix.go == '1.22.x' }}
        continue-on-error: true
        run: ./dev guard-go
      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage_go.py \
            --os linux \
            --go "${{ matrix.go }}" \
            --coverprofile golang/coverage.out \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'lang':'golang','os':'linux','go':'${{ matrix.go }}','line_pct':0.0,'status':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'source':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi
      - name: Stash coverage files (unique path)
        id: stash
        if: always()
        continue-on-error: true
        run: |
          set +e
          gokey="$(echo "${{ matrix.go }}" | tr -d '.')"
          artifact_key="linux-go${gokey}"
          echo "artifact_key=${artifact_key}" >> "$GITHUB_OUTPUT"
          mkdir -p "_cov/golang/${artifact_key}"
          cp -f cov.json "_cov/golang/${artifact_key}/cov.json" 2>/dev/null || true
      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: go-cov-${{ steps.stash.outputs.artifact_key }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn
      - name: install-go
        run: ./dev install-go
      - name: verify-install-go
        run: ./dev verify-install go
      - name: uninstall-go
        run: ./dev uninstall-go
      - name: verify-uninstall-go (expect failure)
        env:
          VERIFY_REQUIRE_INSTALL: "1"
        run: |
          set +e
          ./dev verify-install go
          status=$?
          if [ $status -eq 0 ]; then
            echo "verify-install succeeded after uninstall; expected failure"
            exit 1
          fi

  macos:
    name: macOS / Go ${{ matrix.go }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(( (github.event_name == 'workflow_dispatch' && (github.event.inputs.enable_go_prerelease == false || github.event.inputs.enable_go_prerelease == 'false')) || (github.event_name == 'workflow_call' && (inputs.enable_go_prerelease == false || inputs.enable_go_prerelease == 'false')) || vars.CI_ENABLE_GO_PRERELEASE == 'false') && '{"go":["1.22.x","1.23.x"]}' || '{"go":["1.22.x","1.23.x","1.24.x","1.25.x"]}') }}
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/devops
    defaults:
      run:
        shell: bash
