          path: _cov
          retention-days: 7
          if-no-files-found: warn
      - name: install-go
        run: ./dev install-go
      - name: verify-install-go
        run: ./dev verify-install go
      - name: uninstall-go
        run: ./dev uninstall-go
      - name: verify-uninstall-go (expect failure)
        env:
          VERIFY_REQUIRE_INSTALL: "1"
        run: |
          set +e
          ./dev verify-install go
          status=$?
          if [ $status -eq 0 ]; then
            echo "verify-install succeeded after uninstall; expected failure"
            exit 1
          fi

  windows:
    name: Windows / Go ${{ matrix.go }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(( (github.event_name == 'workflow_dispatch' && (github.event.inputs.enable_go_prerelease == false || github.event.inputs.enable_go_prerelease == 'false')) || (github.event_name == 'workflow_call' && (inputs.enable_go_prerelease == false || inputs.enable_go_prerelease == 'false')) || vars.CI_ENABLE_GO_PRERELEASE == 'false') && '{"go":["1.22.x","1.23.x"]}' || '{"go":["1.22.x","1.23.x","1.24.x","1.25.x"]}') }}
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}/devops
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Init submodules (sparse Boost)
        continue-on-error: true
        run: python -c "import sys;from devtool.commands.common import base_env;from devtool.commands.ops import cpp as cpp_ops;sys.exit(cpp_ops.git_submodules(base_env()) or 0)"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Setup Go deps
        continue-on-error: true
        run: python -m devtool.cli setup-go
      - name: Build Go
        continue-on-error: true
        run: python -m devtool.cli build-go
      - name: Coverage Go
        continue-on-error: true
        run: python -m devtool.cli coverage-go
      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          python tools/ci/extract_coverage_go.py --os windows --go "${{ matrix.go }}" --coverprofile golang/coverage.out --out cov.json

          if (-not (Test-Path cov.json)) {
            python -c "import json,os; obj={'lang':'golang','os':'windows','go':'${{ matrix.go }}','line_pct':0.0,'status':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'source':'placeholder'}; json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          }
      - name: Stash coverage files (unique path)
        id: stash
        if: always()
        continue-on-error: true
        run: |
          $goKey = "${{ matrix.go }}".Replace(".", "")
          $artifactKey = "windows-go$goKey"
          "artifact_key=$artifactKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path "_cov/golang/$artifactKey" | Out-Null
          Copy-Item -Force cov.json "_cov/golang/$artifactKey/cov.json" -ErrorAction SilentlyContinue
      - name: Upload coverage artifacts (unique)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: go-cov-${{ steps.stash.outputs.artifact_key }}
          path: _cov
          retention-days: 7
          if-no-files-found: warn
      - name: install-go
        run: python -m devtool.cli install-go
      - name: verify-install-go
        run: python -m devtool.cli verify-install go
      - name: uninstall-go
        run: python -m devtool.cli uninstall-go
      - name: verify-uninstall-go (expect failure)
        id: verify_uninstall_go
        continue-on-error: true
        env:
          VERIFY_REQUIRE_INSTALL: "1"
        run: python -m devtool.cli verify-install go
      - name: assert-verify-uninstall-go failed
        if: ${{ steps.verify_uninstall_go.outcome != 'failure' }}
        run: |
          throw "verify-install succeeded after uninstall; expected failure"
