      - name: Setup Go deps
        continue-on-error: true
        run: ./dev setup-go
      - name: Build Go
        continue-on-error: true
        run: ./dev build-go
      - name: Coverage Go
        continue-on-error: true
        run: ./dev coverage-go
      - name: Extract cov.json (never fail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/ci/extract_coverage_go.py \
            --os macos \
            --go "${{ matrix.go }}" \
            --coverprofile golang/coverage.out \
            --out cov.json || true

          if [ ! -f cov.json ]; then
            python3 -c "import json,os;obj={'lang':'golang','os':'macos','go':'${{ matrix.go }}','line_pct':0.0,'status':'placeholder','sha':os.getenv('GITHUB_SHA',''),'run_id':os.getenv('GITHUB_RUN_ID',''),'source':'placeholder'};json.dump(obj,open('cov.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          fi
      - name: Stash coverage files (unique path)
        id: stash
        if: always()
