services:
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    networks:
      - shared_network
    env_file:
      - .env
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgresql-data:
    driver: local

networks:
  shared_network:
    external: true