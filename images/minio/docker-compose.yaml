services:
  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - shared_network
    ports:
      - "9002:9000"   # S3 API
      - "9001:9001"   # 控制台
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin12345678
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data:
    driver: local

networks:
  shared_network:
    external: true