[package]
name = "mental1104"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Common utilities for Espeon (Rust). Mirrors python/golang/cpp layout."
repository = "https://github.com/mental1104/common"   # 如无可留空

[lib]
name = "mental1104"
path = "src/lib.rs"

[features]
# 可选：加速 Hash（默认关，跨平台更稳）
fast-hash = ["dep:ahash"]
# 加密按需启用，不影响原有仅使用集合工具的消费方。
encryption = ["dep:aes-gcm", "dep:cbc", "dep:base64"]

[dependencies]
thiserror = "1"

# 可选加速哈希：在你需要 hash 容器极致性能时启用
ahash = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "contains_bench"
harness = false
