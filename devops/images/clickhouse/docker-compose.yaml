services:
  clickhouse:
    image: yandex/clickhouse-server:latest
    container_name: clickhouse
    networks:
      - shared_network
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_PORT:-9000}:9000"
      - "${CLICKHOUSE_INTERSERVER_PORT:-9009}:9009"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse  # Persistent storage

volumes:
  clickhouse-data:
    driver: local

networks:
  shared_network:
    external: true
