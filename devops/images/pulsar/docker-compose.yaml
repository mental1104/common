services:
  pulsar:
    image: apachepulsar/pulsar-standalone:latest
    container_name: pulsar
    networks:
      - shared_network
    ports:
      - "${PULSAR_BROKER_PORT:-6650}:6650"
      - "${PULSAR_ADMIN_PORT:-8080}:8080"
    volumes: 
      - pulsar-data:/pulsar/data

volumes:
  pulsar-data:
    driver: local

networks:
  shared_network:
    external: true
