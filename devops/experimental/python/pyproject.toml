[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experimental-python-hello"
version = "0.1.0"
description = "Tiny hello-world substring example for experimentation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/exp_hello"]

[tool.hatch.build.targets.sdist]
include = ["src/exp_hello", "tests", "README.md", "pyproject.toml"]
